# Databricks App manifest (template: frd-to-sttm's review_app_react/app.yaml,
# per the documented app.yaml schema: command + env). A custom Python command
# because this is a FastAPI process that also serves the frontend's built
# static assets — see ui/backend/main.py's StaticFiles mount.
#
# Port: DATABRICKS_APP_PORT is injected by the platform at runtime;
# ui/backend/main.py reads it directly (fallback CODEGEN_UI_PORT, then 8571).
#
# Deploy prerequisites:
#   1. cd ui/frontend && npm install && npm run build   (dist/ must exist)
#   2. Live Layer-2 rides Databricks FMAPI (reasoning.provider:
#      databricks_fmapi) — no Anthropic key secret needed. The app's
#      service principal must hold CAN_QUERY on the configured
#      databricks.serving_endpoint (and read access on the UC volumes /
#      frd_contracts table for the fetch panels). Auth inside the app is
#      the platform-injected env (DATABRICKS_HOST + client credentials);
#      codegen.databricks._client uses it whenever DATABRICKS_HOST is set.
#
# KNOWN GAP (untested, same as frd-to-sttm's gap #3): long-request/SSE
# behavior through the Databricks Apps reverse proxy is unvalidated. The
# live run avoids long-held requests by design (POST returns immediately;
# progress is short polls of /api/demo/status), but the proxy's timeout
# behavior for the ~20s pipeline thread and poll cadence has not been
# exercised on a real Apps deployment.
command: ["python", "-m", "ui.backend.main"]
env:
  # HARD MOCK LOCK for the App deployment (2026-09-01): no UI selection or
  # config value can route Layer 2 to a live provider on the App —
  # build_provider returns the mock and /api/demo/live-available reports
  # unavailable with this reason. Live runs belong on the operator's
  # machine. The SP's serving-endpoint grants are irrelevant while this is
  # set.
  - name: "CODEGEN_FORCE_MOCK_PROVIDER"
    value: "1"
