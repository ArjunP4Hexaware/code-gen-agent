# Databricks App manifest (template: frd-to-sttm's review_app_react/app.yaml,
# per the documented app.yaml schema: command + env). A custom Python command
# because this is a FastAPI process that also serves the frontend's built
# static assets — see ui/backend/main.py's StaticFiles mount.
#
# Port: DATABRICKS_APP_PORT is injected by the platform at runtime;
# ui/backend/main.py reads it directly (fallback CODEGEN_UI_PORT, then 8571).
#
# Deploy prerequisites:
#   1. cd ui/frontend && npm install && npm run build   (dist/ must exist)
#   2. Live Layer-2 rides Databricks FMAPI (reasoning.provider:
#      databricks_fmapi) — no Anthropic key secret needed. The app's
#      service principal must hold CAN_QUERY on the configured
#      databricks.serving_endpoint (and read access on the UC volumes /
#      frd_contracts table for the fetch panels). Auth inside the app is
#      the platform-injected env (DATABRICKS_HOST + client credentials);
#      codegen.databricks._client uses it whenever DATABRICKS_HOST is set.
#
# KNOWN GAP (untested, same as frd-to-sttm's gap #3): long-request/SSE
# behavior through the Databricks Apps reverse proxy is unvalidated. The
# live run avoids long-held requests by design (POST returns immediately;
# progress is short polls of /api/demo/status), but the proxy's timeout
# behavior for the ~20s pipeline thread and poll cadence has not been
# exercised on a real Apps deployment.
command: ["python", "-m", "ui.backend.main"]
# SHIPPED DEFAULT (M8.5, 2026-09-18): Layer 2 is MOCK-LOCKED. A fresh deploy
# makes zero model calls until the App's service principal is known to hold
# CAN_QUERY on the serving endpoint (docs/ACFC_DEPLOY.md §4 — declare the
# endpoint as the App resource `llm-endpoint`, or grant it by CLI). Remove the
# variable and redeploy to run live Layer 2 via Databricks FMAPI
# (reasoning.provider: databricks_fmapi -> databricks.serving_endpoint). The
# UI's own gates stay either way: an explicit STTM choice, the cost
# confirmation and mock-on-dry-run. History: the Hexaware App ran unlocked
# from 0.3.4 (2026-09-01) on the strength of that declared resource.
#
# The layout recognizer has its OWN switch: CODEGEN_LAYOUT_PROVIDER=live lets
# it query the endpoint while Layer 2 stays locked (header regions and table
# labels only, never a data row); CODEGEN_FORCE_MOCK_LAYOUT=1 locks it too.
#
# Workspace-specific values are App env, never committed here (a user folder
# path is a workspace identifier). Storage URIs — workspace: = Workspace API,
# volume: = Files API; the roots must exist and be shared with the App's
# service principal (docs/ACFC_DEPLOY.md §3):
#   CODEGEN_EXTRA_INPUT_DIRS   workspace:/Workspace/Users/<user>/codegen/pairs   (';'-separated)
#   CODEGEN_STORAGE_INPUTS     workspace:/Workspace/Users/<user>/codegen/inputs
#   CODEGEN_STORAGE_STATE      workspace:/Workspace/Users/<user>/codegen/state
#   CODEGEN_STORAGE_OUTPUTS    workspace:/Workspace/Users/<user>/codegen/outputs
#   CODEGEN_CONFIG_OVERLAYS    <acfc.overlay.yaml>
#   CODEGEN_NOTIFICATION_EMAILS  <prod-support DL>
env:
  - name: CODEGEN_FORCE_MOCK_PROVIDER
    value: "1"
