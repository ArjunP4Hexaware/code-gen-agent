# CodeGen / Data Engineer Agent — non-secret settings only.
#
# Credentials never live here. ANTHROPIC_API_KEY / DATABRICKS_* resolve from
# the environment (see .env.example).
#
# Every number and name the generator uses lives in this file. A numeric
# literal in generator logic is a bug (Code Review Agent convention).

contracts:
  # Directory holding the contract JSON files; pair paths are relative to it.
  dir: fixtures/contracts
  # Each pair joins one FRD feed contract with one STTM mapping contract.
  # EMPTY since 2026-08-22: the two tracked pairs (MIDS real-FRD contract +
  # MIDS STTM; CAQH real-FRD contract + SYNTHETIC CAQH STTM) were deleted
  # from the repo on the "no client documents in the repository" rule.
  # `codegen generate-all` and the demo UI's startup generate have nothing to
  # run until anonymized pairs are restored here; `codegen generate
  # --frd-contract X --sttm-contract Y` still works with explicit paths, and
  # the fixture-driven tests skip rather than fail.
  pairs: []

# Overrides for FRD feed_name -> STTM feed_id when normalization
# (lowercase, non-alphanumeric -> _) is not enough. Empty by default.
feed_aliases: {}

output:
  dir: out
  reports_dir: reports
  # Option A ("notebook" — today's output, a fresh standalone pipeline, the
  # ~10% case) | Option B ("framework" — DDL scripts + config rows + insert
  # statements for the existing ingestion framework, the ~90% case) | both.
  # CLI --output-mode and the UI selector override per run.
  mode: notebook

framework:
  # Option B knobs. The row layout is NOT here — demo.metadata_sheet is the
  # single source of truth (a stand-in until the client's template arrives;
  # values carry over).
  metadata_layout: demo.metadata_sheet
  # sqlserver | lakebase — the framework DB the inserts target. The store is
  # moving toward Databricks-native; the adapter stays thin and swappable.
  sql_dialect: sqlserver
  # How always_blank ID columns render in inserts: assigned by the ACFC
  # framework / manual by client instruction — never invented by the agent.
  id_placeholder: "NULL"
  # Optional per-tab table override, e.g. {file_layout: dbo.ig_file_layout};
  # an unlisted tab inserts into a table named after the tab.
  tables: {}
  # SYNTHETIC prefix for the stage LOCATION clause in the deployment-team DDL
  # .txt files — labeled synthetic; real container/account come from the
  # client platform, never from the agent.
  synthetic_location_prefix: "abfss://syn-container-stage@synstorage.dfs.synthetic.example"

naming:
  # Side-table names derive from the (detail) stage table + these suffixes.
  # Suffix case follows the stage table's case (EXT_TPL_CAQH_DTL -> _ERRORS).
  errors_table_suffix: "_errors"
  recycle_table_suffix: "_recycle"
  processed_files_table_suffix: "_processed_files"

defaults:
  # Used only when a feed has a recycle rule with no window stated anywhere.
  recycle_window_days: 7

masking:
  # PHI masking policy applied at every log/report/error egress.
  policy: last4
  visible_chars: 4
  mask_char: "*"

segments:
  # Segmented feeds (Header/Detail/Trailer) carry a record-type discriminator
  # as the first column of every row. ASSUMPTION pending the source
  # dictionary — see docs/DESIGN.md open questions.
  record_type_column: record_type
  record_type_values:
    Header: "H"
    Detail: "D"
    Trailer: "T"
  # Source column on the Trailer segment carrying the Detail record count,
  # reconciled by the generated DQ check.
  trailer_count_column: record_count

extractor:
  # Workbook→STTM-mapping-contract extractor (codegen.cli extract-sttm).
  # Flat dialect only; a segmented (Header/Detail/Trailer) layout is a hard
  # error — see CLAUDE.md and docs/EXTRACTOR_RECON.md.
  file_details_sheet: FILE_DETAILS
  version_history_sheet: VERSION_HISTORY
  mapping_sheet_prefix: "MAPPING-"
  # Row-1 band labels (compared after lowercasing + whitespace collapse).
  band_labels:
    source: "source file layout"
    stage: "stage layer"
    standard: "standard layer"
  # Row-2 source-block header synonyms per logical column, same normalization.
  # Three header dialects exist in the one golden workbook alone
  # (docs/EXTRACTOR_RECON.md §3a); extend these lists for new client layouts.
  header_synonyms:
    source_column: ["database column name", "database name", "client data table column name"]
    description: ["description"]
    sample_value: ["sample value", "example values"]
    source_datatype: ["datatype", "data type"]
    null_check: ["null check"]
    phi: ["phi field", "phi/pii field"]
    mandatory: ["mandatory field", "mandatory"]
    value_spec: ["comment"]
  # Stage/Standard block headers (normalized); order-independent.
  table_block_headers: ["schema", "tablename", "columnname", "datatype"]
  # A header starting with this (normalized) marks the per-row recycle column.
  recycle_header_prefix: "recycle flag"
  # Source-side cell values (normalized) marking a trailing audit row.
  audit_source_markers: ["na"]
  file_details_headers:
    vendor: ["vendor"]
    file_name: ["filename", "file name"]
    frequency: ["frequency"]
  # RecycleSpec boilerplate emitted around the VERBATIM workbook validation
  # text (phrasing mirrors the existing MIDS contract fixture).
  recycle_on_match: "Process record into stage table"
  recycle_on_no_match: "Load record to Recycle Table with recycle flag enabled for {window_days} days; retry on subsequent runs"

  # ---- content-driven layout discovery (M1, 2026-09-18) ----------------
  # Vocabulary for codegen.layout.discover: the third discovery strategy,
  # after the MAPPING- prefix path and the segmented (CAQH-shaped) family.
  # Matching is on NORMALIZED text (lowercased; every non-alphanumeric run,
  # including _ / - ( ) ? : # . becomes one space; runs collapsed), so
  # "Target_Column_Name_in_DL" reads "target column name in dl" and
  # "PII (Y/N)" reads "pii y n". Spellings below are the documented headers
  # of SHAPES_FOR_PORT §1 families B and D plus the plain forms every family
  # shares; family A/C/E header oddities that stay unresolved under these
  # tables are M2.5's job (model/user resolution) and are deliberately NOT
  # widened here.
  discovery:
    scan_rows: 40
    band_tokens:
      source: ["source"]
      rules: ["data rules", "destination", "rules"]
      stage: ["stage", "staging"]
      standard: ["standard", "std"]
    roles:
      source:
        ordinal: ["s no", "sl no", "sr no", "field id", "column no", "position", "field no"]
        field_name: ["field name", "database column name", "database name", "client data table column name", "column name", "columnname"]
        source_type: ["type", "datatype", "data type"]
        length: ["length", "len"]
        field_length: ["field length", "field length fixed width"]
        start: ["start", "start position", "start position fixed width"]
        end: ["end", "end position", "end position fixed width"]
        segment: ["segment", "record segment", "segment ex header trailer detail"]
        required: ["required", "mandatory field", "mandatory"]
        nullable: ["nullable", "null not null"]
        null_check: ["null check"]
        pii: ["pii", "phi field", "phi pii field", "pii phi"]
        key: ["key y n", "key", "primary key"]
        load_rule: ["load rules", "load rule"]
        description: ["description", "column description"]
        comments: ["comments", "comment"]
        sample_value: ["sample value", "example values"]
        example_value: ["example value"]
        business_rule: ["business rule"]
        source_database: ["database", "table catalog"]
        source_schema: ["schema", "table schema"]
        source_table: ["tablename", "table name"]
        server: ["server name"]
        inscope: ["inscope for implementation"]
        lob: ["lob"]
      rules:
        data_definition: ["data definition"]
        pii: ["pii", "phi field"]
        primary_key: ["primary key"]
        critical: ["critical data", "critical data elements"]
        not_null: ["not null"]
        required: ["required", "required situational optional"]
        load_rule: ["load rules", "load rule"]
        dq_rules: ["dq rules"]
      target:
        workspace: ["workspace"]
        catalog: ["catalog", "target catalog"]
        schema: ["schema", "schema name", "target schema", "target schema name in lakehouse", "stage schema", "standard schema", "schemaname"]
        table: ["tablename", "table name", "target table", "target table name in lakehouse", "stage table name", "standard table name"]
        column: ["columnname", "column name", "target column", "target column name in lakehouse", "stage column name", "standard column name"]
        target_type: ["datatype", "data type", "target data type in lakehouse", "stage datatype", "standard data type"]
        mandatory_column: ["mandatory column", "mandatory"]
        primary_key: ["primary key"]
        constraints: ["constraints"]
        field_description: ["field description"]
        table_description: ["table description"]
        transformation: ["transformations data quality", "transformation", "transformations"]
      trailing:
        recycle_flag: ["recycle flag"]
        dq_mandatory: ["mandatory fields include in dq check"]
        comments: ["comments", "comment"]
    meta_synonyms:
      file_names: ["file names", "file name", "file s", "files", "file name s"]
      file_name_example: ["file name example"]
      frequency: ["frequency", "file frequency"]
      file_format: ["file format text csv", "file format", "file type"]
      delimiter: ["file delimiter", "delimiter"]
      last_update_date: ["last update date"]
      version: ["version"]
      lob: ["lob"]
      target_table_desc: ["target table name desc", "target table description"]
      feed_type: ["feed type"]
      load_strategy: ["load strategy"]
      notes: ["notes", "note"]
      file_generator: ["file generator"]
      file_location: ["file location"]
      domain: ["domain"]
      sub_domain: ["sub domain", "subdomain"]
    segment_synonyms:
      Header: ["header", "hdr", "hddr", "hr", "header record", "h"]
      Detail: ["detail", "dtl", "det", "dr", "detail record", "d", "data"]
      Trailer: ["trailer", "trl", "trlr", "tr", "trailer record", "t"]
    auxiliary_sheets:
      file_details: [["vendor", "filename"], ["vendor", "file name"], ["inbound file name"]]
      table_details: [["table name", "table description"], ["name", "table description", "load strategy"]]
      dq_rules: [["dq rules"]]
      layout: [["field name", "type", "length", "start", "end"]]
      version: [["version", "date"]]
      lob_crosswalk: [["lob"]]
    yes_values: ["yes", "y", "true", "x", "required", "mandatory", "m", "not null", "1"]
    no_values: ["no", "n", "false", "optional", "situational", "s", "null", "0", "nullable"]

  # ---- FRD .docx extractor (M2, 2026-09-18) ----------------------------
  # codegen.extract.frd_docx: section titles and label synonyms, populated
  # ONLY with the variants docs/acfc/SHAPES_FOR_PORT.md §2 lists (trailing
  # colons, the embedded newline, DL/Lakehouse wording, "Load Strategy STD
  # (View)"). Matching is case-insensitive, whitespace/newline-collapsed and
  # ignores a trailing colon. Labels the document families use for fields
  # the contract has no slot for (owners, stewards, SLA …) are logged, not
  # mapped; fields no listed label covers stay unresolved (M2.5's job).
  frd:
    section_titles:
      descriptive: ["Descriptive Metadata"]
      structural: ["Structural Metadata"]
      administrative: ["Administrative Metadata"]
      technical: ["Technical Metadata"]
      data_quality: ["Data Quality", "Data Quality Considerations/Options"]
      vendor: ["Vendor Metadata"]
      recycle: ["Reject /Recycle Process"]
      email: ["Email"]
    fixed_rows:
      name: ["Name"]
      description: ["Description"]
      functional_requirement: ["Functional Requirement", "Functional Requirement:"]
      business_requirement: ["Business Requirement", "Business \nRequirement"]
    labels:
      # Descriptive
      data_source: ["Data Source"]
      object_name: ["Object Name"]
      frequency: ["Frequency"]
      lobs: ["LOBs"]
      solution_acceptance_criteria: ["Solution Acceptance Criteria"]
      traced_requirements: ["Traced/Related Requirements", "Traced Requirements"]
      # Structural
      object_format: ["Object/data Format"]
      target_schema: ["Target Catalog and Schema", "Target Schema"]
      target_table_name: ["Target Table Name"]
      domain_subdomain: ["Domain and Subdomain"]
      load_strategy_stg: ["Load Strategy STG"]
      load_strategy_std: ["Load Strategy STD", "Load Strategy STD (View)"]
      archive_schedule: ["Archive Schedule"]
      source_data_dictionary: ["Source Data Dictionary"]
      adls_location: ["ADLS Location"]
      inbound_folder: ["Inbound File Folder Path", "Inbound/outbound File Folder Path"]
      # Technical
      business_rules: ["Business Rules"]
      filter_criteria: ["Filter Criteria"]
      pii_fields: ["PII Fields"]
      transformation_logic: ["Transformation Logic"]
      # Data Quality (positional rule rows; the recycle row also feeds recycle_rule)
      recycle_process: ["Record Recycle Process (HARD - In pipeline)"]
      # Vendor
      vendor_name: ["Vendor Name"]
      vendor_abbreviation: ["Vendor Abbreviation"]
    solution_requirement_prefix: "Solution Requirement"
    solution_requirement_section_row: 4
    inline_pair_separators: [";"]
    list_separators: [",", ";", "\n"]
    domain_separators: ["/", ","]
    target_schema_markers:
      stage: ["STG", "Stage", "Staging"]
      standard: ["STD", "Standard"]
    target_schema_separators: ["/", ";"]
    acd_headers: ["ACD Type", "Name", "Description"]
    # Placeholders the documents write for "nothing stated" — read as blank.
    blank_values: ["None", "N/A", "NA", "-", "TBD"]

reasoning:
  # Layer 2 — only free-text validation rules the deterministic compiler
  # cannot classify. Mock provider unless ANTHROPIC_API_KEY is set;
  # --dry-run forces mock.
  # Proven against our key by frd-to-sttm's live E2E runs (2026-08-07).
  # claude-opus-5 per the 2026-08-28 decision (Databricks App + FMAPI).
  model: claude-opus-5
  max_tokens: 8192
  # No temperature knob: sampling params are removed on this model family —
  # the API returns 400 if one is sent. Live output varies run to run.
  # One retry with the validation error appended, then record a failure.
  max_attempts: 2
  # Layer-2 transport: anthropic (default) | databricks_fmapi (same Claude
  # model via the databricks.serving_endpoint — transport only; needs the
  # [databricks] extra and resolvable workspace auth; mock still wins on
  # dry-run and on unresolvable creds).
  provider: databricks_fmapi

demo:
  # Inputs for the demo UI's Live and Replay modes (CV/golden universe).
  # NOTE 2026-08-22: these three files were deleted with the rest of
  # fixtures/ (see contracts.pairs above). The names are kept because the
  # demo config model requires them and they are anonymized-universe names,
  # not client document titles; Live/Replay fail loudly with "file not found"
  # until anonymized copies are restored at these paths.
  # Replay resolves frd+sttm directly; Live extracts the workbook first
  # (extract-sttm) and generates from the extracted contract.
  frd: "FRD_demo_cv_golden.contract.json"
  sttm: "sttm_mapping_contracts_cv_golden.json"
  workbook: fixtures/workbooks/demo_sttm_cv_golden.xlsx
  # Cost-confirmation copy for the live run (measured 2026-08-07 live E2E).
  estimated_calls: 3
  estimated_cost_usd: 0.10
  estimated_seconds: 20

  # Reference documents the documents card checks for — DISPLAY ONLY in this
  # build; wiring these into generation is the next step. Filenames as they
  # appear in the client SharePoint library, matched case-insensitively (a
  # leading numeric upload prefix like "1787853350398_" is stripped) against
  # every directory in `dirs`. The env var CODEGEN_INPUT_DOCS_DIR
  # (os.pathsep-separated; ":" on POSIX, ";" on Windows) overrides `dirs` —
  # env > YAML, same as the SharePoint knobs — so machine-specific locations
  # stay in the gitignored .env, never here.
  input_documents:
    expected:
      - "FRD_STG_STD_SFMC_Email_Campaign_Tracking_Details_Ingestion_1005310.docx"
      - "FRD-to-STTM-Agent-Data-Governance-Architecture.pptx"
      - "FRD-to-STTM-Agent-Solution-Architecture.pptx"
      # Read at request time by the input-requirements check (the one
      # reference document that IS consumed in processing, not display-only).
      - "FRD-and-Dictionary-Input-Requirements.pptx"
      # EDO standards source documents (added 2026-08-28). Display/presence
      # only — the standards themselves live as data in engineering_standards:
      # and job:; these are the reference originals those values came from.
      - "EDO Data Engineering Naming Standards.docx"
      - "EDO Data Engineering Coding Standards.docx"
      # Client reference artefacts (arrived 2026-08-31): listed by their
      # SCRUBBED names in fixtures/reference/ — the raw exports live only in
      # gitignored inputs/reference_raw/, and the raw playbook filename
      # carries the real RFC number, which never enters a tracked file.
      - "SFMC_IIG.xlsx"
      - "SFMC_Deployment_Playbook.xlsx"
      - "SFMC_stage_table_creation.txt"
      - "SFMC_standard_table_creation.txt"
    dirs:
      - inputs/sharepoint
      - inputs/standards
      - inputs/databricks
      - fixtures/reference

  # Explicit STTM->FRD pairing (canonical stems: lowercase, upload prefix
  # and " (n)" copy suffix stripped, no extension). Checked before ticket-
  # number pairing; the token heuristic only ever SUGGESTS in the UI.
  pairing_map:
    "sttm-medicare expansion-mids-social determine": "frd_medicare expansion-mids - socially determined"

  # "Source files this run will read" panel. The landing-root template
  # encodes the client's CONVENTION (real FRD, Structural Metadata → ADLS
  # Location) as a template — the literal client path never lives in this
  # repo. Rendered (and badged SYNTHETIC) only for feeds whose contract has
  # no landing_location; slugs use the resolver's normalize_feed_name rule.
  source_files:
    landing_root_template: "mftlanding/inbound/{domain}/{sub_domain}/{source_system}"
    # Stand-in load strategies (badged SYNTHETIC): the real values come from
    # the FRD's Structural Metadata → Load Strategy STG / STD rows.
    load_strategy: { stage: "Truncate and Load", standard: "Upsert" }

  # UC volume coordinates the shell block renders/lists against — REAL as
  # of 2026-08-27: the volume is created and seeded with SYNTHETIC files by
  # `codegen databricks-seed-landing` (the seam's first write task, the one
  # the Option A header named). Live mode lists it through the volumes
  # seam; synthetic mode remains the offline fallback.
  databricks_paths: { catalog: soham_workspace, schema: codegen_agent, volume: mftlanding }
  # live | synthetic | auto (live when creds resolve and the volume exists,
  # else synthetic — honestly labelled either way).
  shell_listing: auto

  # Metadata-sheet preview for ACFC's metadata-driven framework — DISPLAY
  # ONLY. Stand-in layout: the tab names and headers are OUR guess at the
  # client's metadata Excel template. TODO: replace with the client's
  # template (tabs + headers) once received; values carry over. Headers in
  # `always_blank` are assigned by the ACFC framework / manually by client
  # instruction — the agent leaves them blank and flags them.
  metadata_sheet:
    # The REAL client IIG layout (anonymized reference arrived 2026-08-31):
    # 7 tabs + headers sourced verbatim from fixtures/reference/SFMC_IIG.xlsx
    # (scrubbed by scripts/scrub_reference.py from the raw client export).
    # Header spellings — including CRETAED_BY — are the client's, kept as-is.
    tabs:
      DATA_FACTORY_PIPELINE_SCHEDULE:
        headers: [PIPELINE_ID, PIPELINE_NAME, PARENT_PIPELINE_ID, PIPELINE_DESCRIPTION, PIPELINE_FREQUENCY, NO_OF_CYCLE_PER_DAY, DAY_OF_SCHEDULE, ACTIVE_FLAG, ACTIVE_START_DATE, ACTIVE_END_DATE, ESTIMATED_START_TIME, APPLICATION_NAME, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE, PROCESS_NAME, SUBPROCESS_NAME, LAYER_NAME, COMPLETION_SLA, RUNTIME_SLA, CRITICAL_PROCESSING_PERIOD, UDF1, UDF2, UDF3, UDF4, UDF5, IsFileCopyReqFlag]
      ADLS_DELTA_INGESTION_DETAILS:
        headers: [GROUP_ID, OBJECT_ID, OBJECT_NAME, DOMAIN, SUBDOMAIN, PIPELINE_ID, SOURCE, FREQUENCY, LOB, CLAIM_TYPE_ID, ACTIVE_FLAG, SRC_ADLS_CONNECTION_ID, METADATA_CONNECTION_ID, SRC_CONTAINER_NAME, SRC_ADLS_PATH, SRC_FILE_NAME, SRC_FORMAT, SRC_COLUMNS, SRC_DATA_TYPE, SRC_FILE_DELIMITER, SRC_REC_LNGTH, SRC_COL_LNGTH, SRC_COL_STRT_END_INDX, SRC_ADLS_ARCHVL_PATH, SRC_COMPRESSION, HEADER_FLAG, MULTILINE_FLAG, SCHEMA_DRIFT_FLAG, FILE_HEADER_FLAG, FILE_FOOTER_FLAG, MANDATORY_FIELD_LIST, TGT_CONNECTION_ID, TGT_DATABASE_NAME, TGT_TABLE_NAME, TGT_CONTAINER_NAME, TGT_ADLS_PATH, TGT_COLUMN_NAMES, TGT_FORMAT, TGT_DATA_TYPE, TGT_LOAD_OPTION, TGT_RJT_TABLE_NAME, TGT_RJT_ADLS_PATH, TGT_PARTITION_COLUMN, TGT_PARTITION_VALUE, TGT_PRIMARY_KEY, RECYCL_ENBL_FLG, RECYCL_TBL_NM, RECYCL_ADLS_PATH, RECYCL_RETN_DAYS, MAPPING_EXPRESSION, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE, FILE_METADATA]
      STGDELTA_STDDELTA_INGESTION_DET:
        headers: [GROUP_ID, OBJECT_ID, OBJECT_NAME, DOMAIN, SUBDOMAIN, PIPELINE_ID, SOURCE, FREQUENCY, LOB, ACTIVE_FLAG, SRC_ADLS_CONNECTION_ID, METADATA_CONNECTION_ID, SRC_CONTAINER_NAME, SRC_ADLS_PATH, SRC_TABLE_NAME, SRC_CATALOG_NAME, SRC_SCHEMA_NAME, SRC_FORMAT, SRC_COLUMNS, SRC_DATA_TYPE, SRC_ADLS_ARCHVL_PATH, TGT_CONNECTION_ID, TGT_CATALOG_NAME, TGT_SCHEMA_NAME, TGT_TABLE_NAME, TGT_CONTAINER_NAME, TGT_ADLS_PATH, TGT_COLUMN_NAMES, TGT_FORMAT, TGT_DATA_TYPE, TGT_LOAD_OPTION, TGT_RJT_TABLE_NAME, TGT_RJT_ADLS_PATH, TGT_PARTITION_COLUMN, TGT_PARTITION_VALUE, TGT_PRIMARY_KEY, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE]
      DATA_QUALITY_RULES:
        headers: [GROUP_ID, OBJECT_ID, SEQUENCE_NO, RULE_TYPE, RULE_CLASS, ACTIVE_RULE_FLG, SOURCE_COLUMN, INPUT_PARAM, TARGET_COLUMN, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE]
      DATABRICKS_NOTEBOOK_DETAILS:
        headers: [PIPELINE_ID, PIPELINE_NAME, GROUP_ID, SEQ_NM, PROCESS_NAME, TGT_REFRESH_TYPE, ACTIVE_FLAG, DATABRICKS_WORKSPACE_URL, DATABRICKS_WORKSPACE_SECRET, DATABRICKS_CLUSTERID, DATABRICKS_NOTEBOOK_PATH, DATABRICKS_NOTEBOOK_NAME, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE, CLUSTER_DETAILS_ID, DQ_NOTEBOOK_PATH, DELETE_DATABRICKS_NOTEBOOK_NAME]
      EMAIL_TEMPLATE_CONFIG:
        headers: [TEMPLATE_NAME, PROCESS_NAME, STATUS, ACTIVE_FLAG, SUBJECT, BODY, SENDER_NAME, SENDER_EMAIL, EMAIL_TO, EMAIL_CC, CRETAED_BY, CREATED_AT, UPDATED_BY, UPDATED_AT, EMAIL_NOTIFICATION_URL]
      ALL_FILES_STATIC_INFORMATION:
        headers: [INVENTORY_ID, OBJECT_ID, FILE_NAME, DESCRIPTION, LOB, GOVT_PROGRAM_NM, FILE_TYPE, SUPPLIER, SUPPLIER_CONTACT_PH, SUPPLIER_EMAIL, GENERATOR, GENERATOR_CONTACT_PH, GENERATOR_EMAIL, FREQUENCY, ACTIVE_TERM_STATUS, INTERNAL_CONTACT_NM, INTERNAL_CONTACT_EMAIL, LAST_SUCCESS_PROCESSED_DATE, NEXT_EXPECTED_RECEIVE_DT, FILE_RECEIVE_PER_FREQUENCY, PROCESS_NAME, FILE_TR_MODE, domain, subdomain, vendor_name, CREATED_DATE, UPDATED_DATE]
    # Framework-assigned identifiers (pipeline/group/object/inventory IDs,
    # connection IDs, cluster, workspace URL, secret) — always blank +
    # id_placeholder in inserts, NEVER invented by the agent.
    always_blank: [PIPELINE_ID, PARENT_PIPELINE_ID, GROUP_ID, OBJECT_ID, INVENTORY_ID, SRC_ADLS_CONNECTION_ID, METADATA_CONNECTION_ID, TGT_CONNECTION_ID, CLUSTER_DETAILS_ID, DATABRICKS_WORKSPACE_URL, DATABRICKS_WORKSPACE_SECRET, DATABRICKS_CLUSTERID]

engineering_standards:
  # Three-input model, input #2 — REAL as of 2026-08-26: the EDO Data
  # Engineering Naming Standards + EDO Data Engineering Coding Standards
  # documents. The abbreviation tables below are transcribed from the Naming
  # Standards document; deviations are documented in
  # docs/EDO_STANDARDS_ALIGNMENT.md.
  status: "EDO Data Engineering Naming + Coding Standards (received 2026-08-26)"
  job_prefix_by_frequency: {daily: "D_", weekly: "W_", monthly: "M_", yearly: "Y_", adhoc: "A_"}
  # EDO Databricks WORKFLOW convention:
  #   WF_<3 Char Product>_<3 Char Sub-Product>_<Sources>_<Domain>_<Subdomain>_
  #   <Region/LOB>_<Frequency>
  # {feed} (the feed slug, sanitized uppercase) stands in for the <Sources>
  # component: the slug already carries the vendor prefix AND keeps names
  # unique when one vendor ships several feeds into the same domain (the bare
  # source abbreviation would collide). See docs/EDO_STANDARDS_ALIGNMENT.md.
  job_name_pattern: "WF_{product}_{subproduct}_{feed}_{domain}_{subdomain}_{lob}_{frequency}"
  # EDO Databricks NOTEBOOK convention:
  #   NB_<3 Char Product>_<3 Char Sub-Product>_<Domain>_<Subdomain>_<Functionality>
  notebook_name_pattern: "NB_{product}_{subproduct}_{domain}_{subdomain}_INGEST"
  # Product / Sub-Product codes (Naming Standards tables 3.2 / 3.3): this
  # agent generates Data Lake ingestion pipelines with no sub-product.
  product_code: "DLK"
  sub_product_code: "NSP"
  # Source/Target abbreviations (table 3.1) + vendor names seen in contracts.
  source_abbreviations:
    FACETS: FACETS
    JIVA: JIVA
    CDR: CDR
    UTIL: UTIL
    "Enterprise Data Warehouse": EDWH
    eLTSS: LTSS
    File: FILE
    "Salesforce Marketing Cloud": SFMC
  # Domain/Subdomain abbreviations (table 3.4). Unmapped values fall back to
  # their sanitized uppercase form (e.g. OUTREACH) rather than failing.
  domain_abbreviations:
    CLAIMS: CLM
    CLINICAL: CLIN
    PROVIDER: PRV
    NETWORK: NWK
    VISION: VISN
    PHARMACY: RX
    DENTAL: DNTL
    MEMBER: MBR
    ENROLLMENT: ENRL
    ELIGIBLITY: ELIG      # spelling as in the standards document
    ELIGIBILITY: ELIG
    COVERAGE: CVRG
    LABORATORY: LAB
    MEDICATION: MED
    IMMUNIZATION: IMNZ
    "VITAL SIGN": VTL
    GENERIC: GNR
  # Region/LOB abbreviations (table 3.5); multi-LOB feeds use "ALL".
  lob_abbreviations:
    All: ALL
    "All Region": REG_ALL
    EXCHANGE: REG_EXCH
    MMP: REG_MMP
    "REGION 1": REG_1
    "REGION 2": REG_2
    "REGION 5": REG_5
    "REGION 6": REG_6
  # Frequency abbreviations (table 3.6), keyed by the FAQ vocabulary.
  frequency_abbreviations:
    hourly: HRL
    daily: DLY
    weekly: WKL
    fortnightly: FRT
    monthly: MTH
    quarterly: QTR
    yearly: YRL
    adhoc: ADH
    onetime: ONT
    history: HST
  # No resolvable frequency => the job ships unscheduled, i.e. ad hoc.
  unknown_frequency_abbreviation: ADH
  multi_lob_abbreviation: ALL
  # MVP prerequisite: raw/stage/standard tables already exist. DDL files are
  # emitted as REFERENCE only; the notebook lists prerequisite tables instead
  # of creating them.
  create_tables: false
  type_mapping: []   # e.g. [{source: float, target: DOUBLE}]

load_pattern_faq:
  # Three-input model, input #3 — per-feed load-pattern Q&A answer files
  # (<feed_slug>.faq.yaml in per_feed_dir). Missing file => all answers
  # default with source "unknown", each surfaced as a gate flag.
  schema_version: 1
  per_feed_dir: "fixtures/faq"

gate:
  # Pre-flight of the Code Review Agent's checks over generated output.
  run_generated_tests: true
  ruff: true
  structural_checks: true
  # Debug-statement patterns the structural check scans generated code for.
  debug_patterns:
    - "breakpoint()"
    - "pdb.set_trace("
    - "print(\"DEBUG"
    - "print('DEBUG"
  # How many trailing pytest output lines the gate keeps in check details.
  pytest_tail_lines: 15

sharepoint:
  # Microsoft Graph transport (codegen.sharepoint) — the document library is
  # the program's system of record: STTM workbooks and FRD contracts in,
  # generated artifacts out. NON-SECRET knobs only.
  #
  # Identity and the secret are env-only and never belong in this file:
  #   SHAREPOINT_TENANT_ID, SHAREPOINT_CLIENT_ID, SHAREPOINT_CLIENT_SECRET
  # (see .env.example). Each knob below is also overridable by the uppercased
  # env var of the same name (SHAREPOINT_HOST, SHAREPOINT_SITE_PATH, ...) so a
  # deployment can point at its own site without editing the tracked config.
  #
  # Empty = SharePoint unconfigured. That is a supported state: the UI hides
  # the picker, the CLI subcommands fail loudly naming the remedy, and every
  # other command is unaffected. Nothing here has been run against a real
  # tenant yet — see CLAUDE.md "Known gaps".
  host: ""              # e.g. contoso.sharepoint.com
  site_path: ""         # server-relative, must start with '/' — e.g. /sites/DataOffice
  library: ""           # document library display name; blank falls back to "Documents"
  input_folder: ""      # workbooks + contracts live here; "" = library root
  output_folder: ""     # generated artifacts are published here (the ONLY path we write)

databricks:
  # Unity Catalog volumes transport (codegen.databricks) — raw client FRD
  # documents and STTM workbooks in; READ-ONLY (list + download). The seam
  # sits at the edge like SharePoint: `codegen databricks-fetch` lands files
  # in inputs/databricks/ and generation proceeds from local disk.
  #
  # NON-SECRET knobs only; auth is whatever the named profile resolves
  # (CLI OAuth keyring here — no token in this repo, ever). Each knob is
  # overridable by the uppercased DATABRICKS_* env var. Empty = Databricks
  # unconfigured: the UI hides the panel, the CLI fails loudly naming the
  # remedy, and everything else is unaffected.
  profile: DEFAULT
  # NOTE: catalog/schema here address the REAL document volumes the fetch
  # seam reads (uploaded 2026-08-27). The demo shell block's placeholders
  # live separately under demo.databricks_paths — no landing volume exists
  # in the workspace yet (Option A decision).
  catalog: soham_workspace
  schema: codegen_agent
  frd_volume: frd_raw
  sttm_volume: sttm_raw
  # B1 (discovery 2026-08-27, docs/DATABRICKS_DISCOVERY.md):
  # "Serverless Starter Warehouse", serverless PRO, auto-stop 10 min.
  # EXPLAIN is the ONLY statement shape this seam sends — and an EXPLAIN
  # wakes the warehouse, which bills DBUs from the shared ~120/month pool.
  warehouse_id: "172877b5178f7bb7"
  # Matches reasoning.model exactly: the same Claude model, served by
  # Databricks FMAPI. A transport, not a vendor change.
  serving_endpoint: databricks-claude-opus-5
  # No wrapper job exists in the Hexaware workspace; supplied by the client.
  wrapper_notebook_path: ""
  # The ONE writable volume (guarded by construction in codegen.databricks:
  # anything outside soham_workspace.codegen_agent.* is refused). Seeded
  # with synthetic files only — never client documents.
  landing_volume: mftlanding
  # Default target for the human-gated artifact publish (databricks-publish
  # CLI / the UI's publish panel). The panel lets the user pick any
  # catalog.schema.volume, but code refuses anything outside
  # WRITABLE_PREFIX — publishing never touches client schemas.
  output_volume: generated
  # SELECT-only table-read allowlist (read_table_rows renders the statement
  # itself; callers never pass SQL). Reads wake the serverless warehouse —
  # DBU spend from the shared pool. FRD contracts come from the upstream
  # FRD->STTM agent's table; a missing contract means "run that agent
  # first", never a workaround here.
  readable_tables:
    - soham_workspace.sttm_agent.frd_contracts

job:
  # EDO coding standard: EVERY pipeline must send both success and failure
  # email alerts to the Production Support team DL. The generated
  # email_notifications block is now always emitted with these recipients.
  # SYNTHETIC stand-in (2026-08-31): the real prod-support DL is a client
  # value and never lives in a tracked file or emitted artefact; the client
  # substitutes their DL at deployment.
  notification_emails: ["syn.dl.prodsupport@synthetic.example"]
  # Databricks Runtime / cluster shape for generated job JSON.
  # EDO coding standard: DBR >= 15.4 LTS with Photon enabled only.
  spark_version: "15.4.x-scala2.12"
  node_type_id: "Standard_DS3_v2"
  num_workers: 2
  runtime_engine: "PHOTON"
  # EDO coding standard: never leave the platform default (7-day) timeout —
  # set execution hours + 1. The SFMC FRD's file SLA is 6 hours => 7.
  timeout_hours: 7
