engineering_standards:
  # Three-input model, input #2 — REAL as of 2026-08-26: the EDO Data
  # Engineering Naming Standards + EDO Data Engineering Coding Standards
  # documents. The abbreviation tables below are transcribed from the Naming
  # Standards document; deviations are documented in
  # docs/EDO_STANDARDS_ALIGNMENT.md.
  status: "EDO Data Engineering Naming + Coding Standards (received 2026-08-26)"
  job_prefix_by_frequency: {daily: "D_", weekly: "W_", monthly: "M_", yearly: "Y_", adhoc: "A_"}
  # EDO Databricks WORKFLOW convention:
  #   WF_<3 Char Product>_<3 Char Sub-Product>_<Sources>_<Domain>_<Subdomain>_
  #   <Region/LOB>_<Frequency>
  # {feed} (the feed slug, sanitized uppercase) stands in for the <Sources>
  # component: the slug already carries the vendor prefix AND keeps names
  # unique when one vendor ships several feeds into the same domain (the bare
  # source abbreviation would collide). See docs/EDO_STANDARDS_ALIGNMENT.md.
  job_name_pattern: "WF_{product}_{subproduct}_{feed}_{domain}_{subdomain}_{lob}_{frequency}"
  # EDO Databricks NOTEBOOK convention:
  #   NB_<3 Char Product>_<3 Char Sub-Product>_<Domain>_<Subdomain>_<Functionality>
  notebook_name_pattern: "NB_{product}_{subproduct}_{domain}_{subdomain}_INGEST"
  # Product / Sub-Product codes (Naming Standards tables 3.2 / 3.3): this
  # agent generates Data Lake ingestion pipelines with no sub-product.
  product_code: "DLK"
  sub_product_code: "NSP"
  # Source/Target abbreviations (table 3.1) + vendor names seen in contracts.
  source_abbreviations:
    FACETS: FACETS
    JIVA: JIVA
    CDR: CDR
    UTIL: UTIL
    "Enterprise Data Warehouse": EDWH
    eLTSS: LTSS
    File: FILE
    "Salesforce Marketing Cloud": SFMC
  # Domain/Subdomain abbreviations (table 3.4). Unmapped values fall back to
  # their sanitized uppercase form (e.g. OUTREACH) rather than failing.
  domain_abbreviations:
    CLAIMS: CLM
    CLINICAL: CLIN
    PROVIDER: PRV
    NETWORK: NWK
    VISION: VISN
    PHARMACY: RX
    DENTAL: DNTL
    MEMBER: MBR
    ENROLLMENT: ENRL
    ELIGIBLITY: ELIG      # spelling as in the standards document
    ELIGIBILITY: ELIG
    COVERAGE: CVRG
    LABORATORY: LAB
    MEDICATION: MED
    IMMUNIZATION: IMNZ
    "VITAL SIGN": VTL
    GENERIC: GNR
  # Region/LOB abbreviations (table 3.5); multi-LOB feeds use "ALL".
  lob_abbreviations:
    All: ALL
    "All Region": REG_ALL
    EXCHANGE: REG_EXCH
    MMP: REG_MMP
    "REGION 1": REG_1
    "REGION 2": REG_2
    "REGION 5": REG_5
    "REGION 6": REG_6
  # Frequency abbreviations (table 3.6), keyed by the FAQ vocabulary.
  frequency_abbreviations:
    hourly: HRL
    daily: DLY
    weekly: WKL
    fortnightly: FRT
    monthly: MTH
    quarterly: QTR
    yearly: YRL
    adhoc: ADH
    onetime: ONT
    history: HST
  # No resolvable frequency => the job ships unscheduled, i.e. ad hoc.
  unknown_frequency_abbreviation: ADH
  multi_lob_abbreviation: ALL
  # MVP prerequisite: raw/stage/standard tables already exist. DDL files are
  # emitted as REFERENCE only; the notebook lists prerequisite tables instead
  # of creating them.
  create_tables: false
  type_mapping: []   # e.g. [{source: float, target: DOUBLE}]

load_pattern_faq:
  # Three-input model, input #3 — per-feed load-pattern Q&A answer files
  # (<feed_slug>.faq.yaml in per_feed_dir). Missing file => all answers
  # default with source "unknown", each surfaced as a gate flag.
  schema_version: 1
  per_feed_dir: "fixtures/faq"

gate:
  # Pre-flight of the Code Review Agent's checks over generated output.
  run_generated_tests: true
  ruff: true
  structural_checks: true
  # Debug-statement patterns the structural check scans generated code for.
  debug_patterns:
    - "breakpoint()"
    - "pdb.set_trace("
    - "print(\"DEBUG"
    - "print('DEBUG"
  # How many trailing pytest output lines the gate keeps in check details.
  pytest_tail_lines: 15
  # M7 (2026-09-18) derivation gate — codegen.gate.derivations. Every IIG
  # cell single-line; identifier columns charset + cap; path columns no
  # whitespace / empty segment / punctuation-ended segment / doubled
  # separator; DDL COMMENT / LOCATION / TBLPROPERTIES literals single-line,
  # quotes balanced. The framework's own limits are NOT documented — these
  # caps are conservative defaults, replace them with the framework team's.
  derivations:
    name_pattern: "^[A-Za-z0-9_]+$"
    name_columns: [PIPELINE_NAME, DATABRICKS_NOTEBOOK_NAME, TGT_TABLE_NAME, SRC_TABLE_NAME,
                   TGT_DATABASE_NAME, TGT_SCHEMA_NAME, SRC_SCHEMA_NAME, TGT_CATALOG_NAME,
                   SRC_CATALOG_NAME, TGT_RJT_TABLE_NAME, RECYCL_TBL_NM]
    name_max_length: {default: 128, PIPELINE_NAME: 128, DATABRICKS_NOTEBOOK_NAME: 128}
    path_column_suffixes: [_PATH, _DIR, _ROOT_DIR]
    path_max_length: 1024
    max_name_token_length: 32
    # Sibling-type check: suffix groups whose standard-band types must agree
    # (plus any suffix >= sibling_min_group columns share).
    sibling_suffixes: [_pct, _pop, _amt, _dt, _cd, _id, _nm, _flg, _cnt, _ind, _qty]
    sibling_min_group: 3

sharepoint:
  # Microsoft Graph transport (codegen.sharepoint) — the document library is
  # the program's system of record: STTM workbooks and FRD contracts in,
  # generated artifacts out. NON-SECRET knobs only.
  #
  # Identity and the secret are env-only and never belong in this file:
  #   SHAREPOINT_TENANT_ID, SHAREPOINT_CLIENT_ID, SHAREPOINT_CLIENT_SECRET
  # (see .env.example). Each knob below is also overridable by the uppercased
  # env var of the same name (SHAREPOINT_HOST, SHAREPOINT_SITE_PATH, ...) so a
  # deployment can point at its own site without editing the tracked config.
  #
  # Empty = SharePoint unconfigured. That is a supported state: the UI hides
  # the picker, the CLI subcommands fail loudly naming the remedy, and every
  # other command is unaffected. Nothing here has been run against a real
  # tenant yet — see CLAUDE.md "Known gaps".
  host: ""              # e.g. contoso.sharepoint.com
  site_path: ""         # server-relative, must start with '/' — e.g. /sites/DataOffice
  library: ""           # document library display name; blank falls back to "Documents"
  input_folder: ""      # workbooks + contracts live here; "" = library root
  output_folder: ""     # generated artifacts are published here (the ONLY path we write)

databricks:
  # Unity Catalog volumes transport (codegen.databricks) — raw client FRD
  # documents and STTM workbooks in; READ-ONLY (list + download). The seam
  # sits at the edge like SharePoint: `codegen databricks-fetch` lands files
  # in inputs/databricks/ and generation proceeds from local disk.
  #
  # NON-SECRET knobs only; auth is whatever the named profile resolves
  # (CLI OAuth keyring here — no token in this repo, ever). Each knob is
  # overridable by the uppercased DATABRICKS_* env var. Empty = Databricks
  # unconfigured: the UI hides the panel, the CLI fails loudly naming the
  # remedy, and everything else is unaffected.
  profile: DEFAULT
  # NOTE: catalog/schema here address the REAL document volumes the fetch
  # seam reads (uploaded 2026-08-27). The demo shell block's placeholders
  # live separately under demo.databricks_paths — no landing volume exists
  # in the workspace yet (Option A decision).
  catalog: soham_workspace
  schema: codegen_agent
  frd_volume: frd_raw
  sttm_volume: sttm_raw
  # B1 (discovery 2026-08-27, docs/DATABRICKS_DISCOVERY.md):
  # "Serverless Starter Warehouse", serverless PRO, auto-stop 10 min.
  # EXPLAIN is the ONLY statement shape this seam sends — and an EXPLAIN
  # wakes the warehouse, which bills DBUs from the shared ~120/month pool.
  warehouse_id: "172877b5178f7bb7"
  # Matches reasoning.model exactly: the same Claude model, served by
  # Databricks FMAPI. A transport, not a vendor change.
  serving_endpoint: databricks-claude-opus-5
  # No wrapper job exists in the Hexaware workspace; supplied by the client.
  wrapper_notebook_path: ""
  # The ONE writable volume (guarded by construction in codegen.databricks:
  # anything outside soham_workspace.codegen_agent.* is refused). Seeded
  # with synthetic files only — never client documents.
  landing_volume: mftlanding
  # Default target for the human-gated artifact publish (databricks-publish
  # CLI / the UI's publish panel). The panel lets the user pick any
  # catalog.schema.volume, but code refuses anything outside
  # WRITABLE_PREFIX — publishing never touches client schemas.
  output_volume: generated
  # SELECT-only table-read allowlist (read_table_rows renders the statement
  # itself; callers never pass SQL). Reads wake the serverless warehouse —
  # DBU spend from the shared pool. FRD contracts come from the upstream
  # FRD->STTM agent's table; a missing contract means "run that agent
  # first", never a workaround here.
  readable_tables:
    - soham_workspace.sttm_agent.frd_contracts

layout:
  # Layout recognition (M2.5, 2026-09-18): a model decides WHERE things are,
  # code copies the values. Resolution order cache -> synonyms -> model ->
  # validate -> user; a fully-resolved-by-synonyms document makes no model
  # call. Caches hold completed LayoutProfile / FrdLayoutProfile JSON keyed
  # by the fingerprint field inside each file.
  cache_dirs: ["fixtures/layout_profiles"]
  runtime_cache_dir: "ui/backend/state/layout_profiles"
  mock_dir: "fixtures/layout_profiles/mock"
  # auto: live when Layer 2 is live (same transport, databricks_fmapi /
  # anthropic; mock on dry-run and on the mock lock) | mock: never a model
  # | live (M8.3): the recognizer's OWN opt-in — it queries `endpoint` (else
  # databricks.serving_endpoint) through FMAPI even while Layer 2 is
  # mock-locked; same request (header regions / table labels, never a data
  # row), same validator. dry-run and CODEGEN_FORCE_MOCK_LAYOUT=1 still force
  # the mock. Env CODEGEN_LAYOUT_PROVIDER / CODEGEN_LAYOUT_ENDPOINT win. The
  # App's service principal needs CAN_QUERY on it (docs/ACFC_DEPLOY.md §4).
  provider: auto
  endpoint: null
  max_tokens: 8192
  max_attempts: 2
  model_confidence: 0.8
  crosscheck_bonus: 0.1

job:
  # EDO coding standard: EVERY pipeline must send both success and failure
  # email alerts to the Production Support team DL. The generated
  # email_notifications block is now always emitted with these recipients.
  # SYNTHETIC stand-in (2026-08-31): the real prod-support DL is a client
  # value and never lives in a tracked file or emitted artefact; the client
  # substitutes their DL at deployment.
  notification_emails: ["syn.dl.prodsupport@synthetic.example"]
  # Databricks Runtime / cluster shape for generated job JSON.
  # EDO coding standard: DBR >= 15.4 LTS with Photon enabled only.
  spark_version: "15.4.x-scala2.12"
  node_type_id: "Standard_DS3_v2"
  num_workers: 2
  runtime_engine: "PHOTON"
  # EDO coding standard: never leave the platform default (7-day) timeout —
  # set execution hours + 1. The SFMC FRD's file SLA is 6 hours => 7.
  timeout_hours: 7

conventions:
  # M4 (2026-09-18): client conventions profiles for the deployment-team DDL.
  # edo_sfmc is TODAY'S output exactly (two .txt files conformant to the SFMC
  # reference goldens). acfc_prx is the pair-1 RFC package shape
  # (docs/acfc/rfc_capture/.../goldens/pair_1/ACCUM_DDL.txt): one combined
  # file, '--stage table' / '--standard table' banners, CREATE OR REPLACE,
  # stage columns TYPED as the STTM stage band states them, audit columns in
  # upper-case types, standard = the stage column list, no LOCATION /
  # CLUSTER BY / TBLPROPERTIES / TAGS / COMMENTs. Whitespace knobs are data:
  # the golden opens with a blank line, has a lone-space line before the
  # standard block's USING clause, and ends WITHOUT a trailing newline.
  # CLI: codegen generate --profile <name>.
  profile: edo_sfmc
  # M7.1: the last fallback of the catalog chain (FRD label -> STTM band ->
  # here) for every profile; a pair whose documents state no catalog
  # resolves to it with provenance `config_default`. Per environment in an
  # overlay, e.g. {stage: d1_dlk, standard: d1_dlk}. Empty = none configured.
  default_catalog: {}
  # M9.2: last link of the SCHEMA chain (layer -> schema): STTM target band
  # -> FRD 'Target Catalog and Schema' -> here (provenance config_default);
  # none of the three states one = extract-sttm's hard stop. Empty = none.
  default_schema: {}
  profiles:
    edo_sfmc:
      ddl_layout: two_files
    acfc_prx:
      ddl_layout: combined
      # {feed_abbrev} = the load-pattern FAQ's feed_abbreviation (a
      # client-assigned name); absent -> sanitized feed slug + a gate flag.
      ddl_file_name_pattern: "{feed_abbrev}_DDL.txt"
      typed_stage: true
      standard_from_stage: true
      create_statement: "CREATE OR REPLACE TABLE"
      using_clause: "USING delta"
      stage_banner: "--stage table"
      standard_banner: "--standard table"
      leading_newline: true
      trailing_newline: false
      block_using_prefix: {stage: "", standard: " "}
      audit_type_casing: {String: STRING, Timestamp: TIMESTAMP}
      # M7: three-part names or no DDL (catalog_unstated:<layer> FAILs).
      # default_catalog is the LAST fallback (FRD label -> STTM band -> here);
      # empty = none configured. Set per environment in an overlay.
      require_qualified_names: true
      default_catalog: {}
      # M7: the SQL Server metadata-DB DML deliverable (dml: section below).
      emit_dml: true
      # M7 §4: off — the combined DDL is byte-compared with the pair-1 golden;
      # the target system is labelled in ADDITION.md / MANIFEST.md instead.
      target_system_header: false

metadata:
  # M4: IIG workbook template versions. iig_v1 = demo.metadata_sheet (the
  # SFMC 7-tab reference layout, today's output byte for byte). iig_v2 is the
  # pair-1 RFC package's 8-sheet layout: sheet names, order and headers
  # transcribed from the aliased golden RFC_ACCUMULATORS_IIG.xlsx in ITS
  # order (including the golden's DATABRICKS_NOTEBOOK_DETAILS header order
  # ... CLUSTER_DETAILS_ID, DELETE_DATABRICKS_NOTEBOOK_NAME, DQ_NOTEBOOK_PATH).
  # Every cell is transcribed from an input (STTM/FRD/FAQ) or is one of the
  # constants / template rows below — framework vocabulary the golden shows
  # constant across rows, badged synthetic with this citation — or is left
  # blank and flagged (iig_blank:<TAB>.<HEADER>). CLI: --iig-template.
  template: iig_v1
  # M7 §5: CLAIM_TYPE_ID default for ADLS→Delta rows — null keeps the
  # goldens' blank; "NA" writes the walkthrough's alternative (§7).
  claim_type_id_default: null
  # M7.1: iig_v1 synthetic TGT_ADLS_PATH domain / subdomain segments are
  # slugified with the names' slug (SOCIAL_DETERMINANTS_OF_HEALTH), so the
  # synthetic path passes the global path gate. false = the old raw words.
  synthetic_path_slug: true
  templates:
    iig_v2:
