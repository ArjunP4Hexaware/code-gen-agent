          headers: [GROUP_ID, OBJECT_ID, SEQUENCE_NO, RULE_TYPE, RULE_CLASS, ACTIVE_RULE_FLG, SOURCE_COLUMN, INPUT_PARAM, TARGET_COLUMN, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE]
        EMAIL_TEMPLATE_CONFIG:
          headers: [TEMPLATE_ID, TEMPLATE_NAME, PROCESS_NAME, STATUS, ACTIVE_FLAG, SUBJECT, BODY, BODY_QUERY, SENDER_NAME, SENDER_EMAIL, EMAIL_TO, EMAIL_CC, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE]
      # Framework-assigned identifiers, connections, containers, the storage
      # account, workspace/cluster/secret handles, template IDs and the
      # audit DATES: always blank, never invented. CREATED_BY / UPDATED_BY
      # left this list in M7: they are the RFC number (METADATA_DB_SEMANTICS
      # §1) — filled from the FAQ rfc_number when answered, blank + flagged
      # otherwise.
      always_blank: [PIPELINE_ID, PARENT_PIPELINE_ID, GROUP_ID, OBJECT_ID, SRC_CONNECTION_ID, SRC_ADLS_CONNECTION_ID, METADATA_CONNECTION_ID, TGT_CONNECTION_ID, SRC_CONTAINER_NAME, TGT_CONTAINER_NAME, TGT_STORAGE_ACCOUNT_NAME, DATABRICKS_WORKSPACE_URL, DATABRICKS_WORKSPACE_SECRET, DATABRICKS_CLUSTERID, CLUSTER_DETAILS_ID, TEMPLATE_ID, CREATED_DATE, UPDATED_DATE]
      # Derivation knobs (each names the golden cell shape it reproduces).
      src_columns_style: positional        # SRC_COLUMNS 'col1:SEGMENT_IDENTIFIER,...'
      data_type_style: base                # SRC_DATA_TYPE 'String:Decimal', 'Decimal:Decimal'
      rows_per_file_pattern: true          # one ADLS_DELTA / DQ object per file pattern
      object_name_from_pattern: true       # 'I_ACCUM_*_TO_CLIENT_*.csv' -> I_ACCUM_TO_CLIENT
      reject_table_suffix: "_reject"       # TGT_RJT_TABLE_NAME = <stage table>_reject
      segment_filter_pattern: "value like '{value}%'"   # from the FAQ's confirmed discriminators
      dq_rules: [date_format, data_type_cast]
      dq_rule_classes: {date_format: DateFormatRule, data_type_cast: DataTypeCastRule}
      # STTM Load Rule 'Convert yyyyMMdd to yyyy-MM-dd' -> INPUT_PARAM 'yyyyMMdd--yyyy-MM-dd'
      date_format_rule_regex: '^\s*Convert\s+(\S+)\s+to\s+(\S+)\s*$'
      date_format_param_joiner: "--"
      cast_type_order: [Decimal, Date]     # DataTypeCastRule lists decimals, then dates
      # The golden IIG spells the audit types 'String' / 'TIMESTAMP' (its DDL
      # says STRING) — transcribed as the IIG states them.
      audit_type_casing: {String: String, Timestamp: TIMESTAMP}
      # Synthetic path shapes per sheet ({landing} = the FRD ADLS Location);
      # the golden spells the archive path two ways, transcribed as such.
      path_patterns:
        ADLS_DELTA_INGESTION_DETAILS:
          SRC_ADLS_ARCHVL_PATH: "{landing}Archive/"
          TGT_ADLS_PATH: "{landing}Processed/{stage_table}"
          TGT_RJT_ADLS_PATH: "{landing}Processed/{reject_table}"
        STGDELTA_STDDELTA_INGESTION_DET:
          SRC_ADLS_PATH: "{landing}Processed/"
          SRC_ADLS_ARCHVL_PATH: "/Archive{landing}"
          TGT_ADLS_PATH: "{landing}Processed/{stage_table}"
          TGT_RJT_ADLS_PATH: "{landing}Processed/{reject_table}"
        ADLS_FIXED_WIDTH_HANDLER:
          SRC_ADLS_ARCHVL_PATH: "/Archive{landing}"
      # Framework vocabulary constant across every golden row (synthetic).
      constants:
        DATA_FACTORY_PIPELINE_SCHEDULE: {NO_OF_CYCLE_PER_DAY: "1", DAY_OF_SCHEDULE: "0", ACTIVE_FLAG: "Y", ACTIVE_END_DATE: "9999-12-31"}
        FILE_ADLS_INGESTION_DETAILS: {SOURCE_TYPE: "File", COPY_START_TIME_OFFSET_IN_MINUTES: "0"}
        ADLS_DELTA_INGESTION_DETAILS: {ACTIVE_FLAG: "Y", TGT_FORMAT: "delta", SRC_COMPRESSION: "N", MULTILINE_FLAG: "N", SCHEMA_DRIFT_FLAG: "N", TGT_PARTITION_COLUMN: "NA", TGT_PARTITION_VALUE: "NA", RECYCL_TBL_NM: "NA", RECYCL_ADLS_PATH: "NA"}
        STGDELTA_STDDELTA_INGESTION_DET: {ACTIVE_FLAG: "Y", SRC_FORMAT: "delta", TGT_FORMAT: "delta", TGT_PARTITION_COLUMN: "NA", TGT_PARTITION_VALUE: "NA"}
        ADLS_FIXED_WIDTH_HANDLER: {ACTIVE_FLAG: "Y", IS_MANDATORY: "N", COLUMN_VALIDATIONS: "NA"}
        DATABRICKS_NOTEBOOK_DETAILS: {SEQ_NM: "1", ACTIVE_FLAG: "Y"}
        DATA_QUALITY_RULES: {RULE_TYPE: "Custom", ACTIVE_RULE_FLG: "Y"}
        EMAIL_TEMPLATE_CONFIG: {ACTIVE_FLAG: "Y"}
      # Template rows. The framework's email statuses are framework
      # vocabulary; the client's pipeline / notebook inventory (pair-1 names)
      # is NOT shipped here — it lives in the fixture overlay
      # fixtures/acfc_shapes/pair_1/config_overlay.yaml (load_config
      # overlays / CODEGEN_CONFIG_OVERLAYS). Without it the pipeline-schedule
      # and notebook-details sheets render one row each, names blank+flagged.
      # '_layer' steers which FRD load strategy feeds TGT_REFRESH_TYPE.
      template_rows:
        EMAIL_TEMPLATE_CONFIG:
          - {STATUS: Success}
          - {STATUS: Failed}

rfc:
  # M5 (2026-09-18): the `rfc` output mode's package tree, the INGESTION
  # family of docs/acfc/rfc_capture/.../RFC_PACKAGE_SHAPES.md §1:
  #   RFC<number>_<Feed>/ <Feed>_IIG.xlsx, the profile's DDL file(s),
  #   RFC<number>_<Feed>_Deployment_Playbook.xlsx, FILE_LOG_INFORMATION.txt
  #   (sometimes present), MANIFEST.md (ours). Runbook / TDD out of scope.
  # {rfc_number} = load-pattern FAQ rfc_number (unanswered -> the shapes
  # document's own masked spelling + a flag); {feed_slug} = FAQ
  # feed_abbreviation, else the sanitized feed slug + a flag.
  dir_pattern: "RFC{rfc_number}_{feed_slug}"
  iig_file_name: "{feed_slug}_IIG.xlsx"
  playbook_file_name: "RFC{rfc_number}_{feed_slug}_Deployment_Playbook.xlsx"
  manifest_file_name: MANIFEST.md
  number_placeholder: "######"
  # FILE_LOG_INFORMATION.txt in the documented T-SQL shape (present in the
  # INGESTION_A package, absent from the PRX ones): off by default; the
  # documented <length> mask is transcribed as-is and flagged.
  file_log_information: false
  file_log_file_name: FILE_LOG_INFORMATION.txt
  file_log_header_line: "CREATE TABLE [dbo].[FILE_LOG_INFORMATION]("
  file_log_columns:
    - "[ID] [int] IDENTITY(1,1) NOT NULL"
    - "[PIPELINE_ID] [int] NOT NULL"
    - "[GROUP_ID] [int] NOT NULL"
    - "[OBJECT_ID] [int] NOT NULL"
    - "[SRC_FILE_NAME] [varchar](MAX) NOT NULL"
    - "[SOURCE_COUNT] [int] NOT NULL"
    - "[TARGET_COUNT] [int] NOT NULL"
    - "[REJECT_COUNT] [int] NOT NULL"
    - "[RECYCLE_COUNT] [int] NOT NULL"
    - "[CREATED_BY] [varchar](<length>) NOT NULL"
    - "[CREATED_DATE] [datetime] NOT NULL"
    - "[UPDATED_BY] [varchar](<length>) NOT NULL"
    - "[UPDATED_DATE] [datetime] NOT NULL"

dml:
  # M7 (2026-09-18): the SQL Server metadata-DB DML deliverable
  # (emit/dml.py), from the SAME config rows as the IIG; every rule cites
  # docs/acfc/METADATA_DB_SEMANTICS.md. One config_inserts_<env>.sql per
  # environment (variables block differs, body identical) + the Databricks
  # notebook source that runs it over JDBC in one transaction.
  enabled: true
  environments: [q1, a2, prod]
  file_name_pattern: "config_inserts_{env}.sql"
  notebook_file_name_pattern: "Insert_scripts_config_table_{env}.py"
  schema: dbo
  # §1: the framework picks rows WHERE ACTIVE_FLAG = 'S' (the IIG goldens
  # print 'Y' — kept there for byte-identity; §10).
  active_flag: "S"
  claim_type_id_default: null
  # Per-environment path prefix for path columns (CONCAT(@PATH_PREFIX, …));
  # '' = none. Fill from the platform team per environment.
  env_path_prefix: {q1: "", a2: "", prod: ""}
  # Databricks secret scope + key NAMES the notebook reads (never values).
  secret_scope: metadata-db
  jdbc_url_secret: jdbc-url
  user_secret: jdbc-user
  password_secret: jdbc-password
  # The file connection table as SPOKEN in the walkthrough (§3) — flagged
  # dml_unconfirmed until the framework team confirms the identifiers.
  connection_table:
    name: FILE_CONNECTION_DETAILS
    id_column: CONNECTION_ID
    description_column: CONNECTION_DESCRIPTION
    host_column: HOST_NAME
    root_column: ROOT_PATH
    source_type_column: SOURCE_TYPE

playbook:
  # Deployment playbook templates (rfc mode). sfmc_7sheet reads the
  # SCRUBBED reference workbook for its structure (sheet order, band +
  # header rows, cover-page labels) and blanks every value the reference
  # carried — dates, times, owners, teams, status, contacts, the schedule
  # grid — each blank flagged playbook_blank:<sheet>.<header>. main_single
  # is the PRX packages' one-sheet layout (RFC_PACKAGE_SHAPES §1 / §4
  # header pattern). Task rows come ONLY from `tasks` below, per
  # conventions profile ("default" otherwise); RFC#s from the run input.
  # CLI: generate --output-mode rfc --playbook-template <name>.
  template: sfmc_7sheet
  templates:
    sfmc_7sheet:
      kind: sfmc_7sheet
      source: fixtures/reference/SFMC_Deployment_Playbook.xlsx
      header_row: 2
      task_sheet: "PrePost-Prod & Prod Execution"
      rollback_execution_sheet: "Rollback Execution"
      rollback_validation_sheet: "Rollback Validation"
      contact_sheet: "Contact List"
      cover_sheet: "Cover Page"
      overview_sheet: "Overview"
      section_labels:
        pre_production: "PRE-PRODUCTION"
        production: "PRODUCTION"
        post_production: "POST PRODUCTION"
        rollback_execution: "BACKOUT/ROLLBACK EXECUTION"
        rollback_validation: "BACKOUT/ROLLBACK VALIDATION"
      # Reference cover-page cells holding the deployment's own values
      # (blanked + flagged) and the template labels kept as written.
      cover_value_cells:
        B6: "Project"
        B15: "Revision history Date"
        C15: "Revision history Version"
        D15: "Revision history Author(s)"
        E15: "Revision history Description of Version/Changes"
      cover_label_cells:
        B6: "Project:"
    main_single:
      kind: main_single
      sheet: Main
      # §1: Task #, Task, Detail, (blank), RFC#s, Deployment Team, dates/times,
      # Task Owner, Status.
      headers: ["Task #", "Task", "Detail", "", "RFC#s", "Deployment Team",
                "Planned Start Date", "Planned End Date", "Actual Start Date", "Actual End Date",
                "Planned Start Time", "Planned End Time", "Actual Start Time", "Actual End Time",
                "Task Owner", "Status"]
  # Task rows: deployment steps phrased over the package's OWN artefacts
  # ({ddl_files}, {iig_file}, {rfc}, {feed}); no client wording. Dates,
  # times, owners and teams are never filled.
  tasks:
    default:
      pre_production: []
      production:
        - task: "Execute the deployment DDL"
          detail: "Run {ddl_files} in the data lake (deployment team — the agent never creates target tables)."
        - task: "Copy the IIG workbook to the ADLS raw location"
          detail: "{iig_file}"
        - task: "Execute the metadata pipeline to insert the IIG entries"
          detail: "Rows of {iig_file}; framework-assigned IDs are blank in the workbook and assigned by the framework."
      post_production:
        - task: "Validate the metadata inserts"
          detail: "Every row of {iig_file} is present in the framework tables."
        - task: "Validate the stage and standard tables exist"
          detail: "Tables created by {ddl_files}."
      rollback_execution:
        - task: "Revert the IIG table changes"
          detail: "Remove the rows inserted from {iig_file}."
      rollback_validation:
        - task: "Validate the IIG tables are reverted"
          detail: "No rows from {iig_file} remain."

# M8.1: where inputs, state and outputs live — one storage URI per role.
#   local:<dir>        a directory (relative = inside the checkout; default)
#   workspace:/Workspace/Users/<user>/<folder>   Workspace API via databricks-sdk
#   volume:/Volumes/<catalog>/<schema>/<volume>/<folder>   UC Volumes, Files API
# Remote roots must already exist and be shared with the caller (the App's
# service principal / the notebook user): the agent creates folders only
# BELOW a root, never the root — and never touches /Volumes or /Workspace as
# a mounted filesystem (docs/ACFC_DEPLOY.md). Env CODEGEN_STORAGE_INPUTS /
# CODEGEN_STORAGE_STATE / CODEGEN_STORAGE_OUTPUTS win over these. Workspace-
# specific URIs belong in an overlay or the App's env, not in this file.
storage:
  inputs: "local:./inputs"              # inboxes: sharepoint/ databricks/ uploads/
  state: "local:./ui/backend/state"     # decisions.json, layout_profiles/
  outputs: null                         # null = output.dir (local), as before M8
  scratch_dir: null                     # working copies of remote roles; null = system temp

# M8.2: extra read-only input roots (storage URIs), scanned at depth 1 — the
# root and its immediate subfolders (pair_1/ ... pair_N/). Env
# CODEGEN_EXTRA_INPUT_DIRS (';'-separated) is appended. Real folder names
# live in an overlay / the App's env, never here.
inputs:
  extra_dirs: []
  scan_depth: 1
  listing_ttl_seconds: 30      # remote listings are API calls; the chooser polls
  # Auto-pairing by content (codegen.pairing): for the chosen STTM every FRD /
  # VDD candidate is scored on what the documents SAY; the ticket number and
  # the file-name stem are two weak signals among several. Paired only when
  # the best reaches min_score and leads the next by margin — otherwise the
  # top candidates are asked (layout dialog / answers file). An explicit
  # demo.pairing_map entry still overrides.
  pairing:
    weights: { feed_name: 2, tables: 3, schema: 1, file_patterns: 3, meta: 1, ticket: 1, name_stem: 1 }
    min_score: 3      # one weak signal (a name, a lone feed-name echo) never pairs
    margin: 2
    top_candidates: 4
