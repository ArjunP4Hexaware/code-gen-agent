            share: "filled in 3.5% of corpus rows; Daily 0.0% filled, Weekly 29.8% filled with '0' the dominant (14.9% of Weekly rows; WEEKLY: 26.8%)"
          LAYER_NAME:
            by: flow
            values: {file_to_stg: STAGE, stg_to_std: STANDARD}
            share: "filled in 38.4% of corpus rows: STAGE 88.7%, STANDARD 7.3%"
          ACTIVE_FLAG: {value: "Y", share: "Y in 97.5% of corpus rows"}
          NO_OF_CYCLE_PER_DAY: {value: "1", share: "1 in 98.2% of corpus rows"}
      # Owed cells: the person owes them, nothing waits on them (INPUT_NEEDED, never
      # QUESTION; answers under inputs: with generate --answers, or the FAQ companion).
      # ACTIVE_START_DATE: the per-RFC go-live date — no document states it, no value
      # dominates (19.4%): written empty. D1 post45: APPLICATION_NAME and EMAIL_TO are
      # written WITH a default (the feed's SOURCE; the corpus's dominant recipient, a
      # D1 placeholder) so the BSA can change them; the NullCheckRule /
      # DeDuplicationRule INPUT_PARAM shape is in no home golden: open until the D1
      # dump supplies it.
      # 2026-10-14 (framework owner's rule 1): PIPELINE_NAME is BSA-assigned - blank on
      # every sheet that carries it (schedule, notebook; the iig_v2 email sheet has no
      # such column), one feed-level INPUT_NEEDED feeds.<feed>.pipeline_name.<flow>
      # per flow row (per_flow; the notebook row of a flow takes the same answer).
      pipeline_roles:
        - {role: grand_master, description: "Grand master"}
        - {role: master, description: "Master", parent: grand_master}
        - {role: file_to_stage, description: "File to Stage", parent: master}
        - {role: stage_to_standard, description: "Stage to Standard", parent: master}
      owed_cells:
        DATABRICKS_NOTEBOOK_DETAILS:
          PIPELINE_NAME: &bsa_pipeline_name
            faq: pipeline_name
            per_flow: true
            question: "the pipeline name (PIPELINE_NAME) of this flow's row - BSA-assigned (framework owner's rule): never generated"
        DATA_FACTORY_PIPELINE_SCHEDULE:
          PIPELINE_NAME: *bsa_pipeline_name
          ACTIVE_START_DATE: {faq: active_start_date, question: "the go-live date of this RFC's pipelines (ACTIVE_START_DATE, 'YYYY-MM-DD 00:00:00' as the corpus writes it): no document states it and no corpus value dominates (19.4%)"}
          APPLICATION_NAME:
            faq: application_name
            scope: run
            question: "the application name (APPLICATION_NAME, the {application} of every PIPELINE_DESCRIPTION / PROCESS_NAME): the corpus's G1, 27 values, the dominant 38.8%"
            default: "{source}"
            default_share: "the feed's SOURCE, the vendor / source system the FRD states"
        EMAIL_TEMPLATE_CONFIG:
          EMAIL_TO:
            faq: email_to
            scope: run
            question: "the alert recipients (EMAIL_TO): the corpus's dominant recipient is 47.6% of filled rows (24 values) — not a majority, confirm per feed"
            default: "<<D1:EMAIL.EMAIL_TO>>"
            default_share: "the corpus's dominant recipient, 47.6% (scrubbed G576@<LOCAL_DENYLIST>.G572)"
        DATA_QUALITY_RULES:
          INPUT_PARAM@NullCheckRule:
            header: INPUT_PARAM
            when: {RULE_CLASS: NullCheckRule}
            faq: dq_null_check_input_param
            question: "the NullCheckRule INPUT_PARAM shape (no home golden carries one; the D1 dump supplies it)"
          INPUT_PARAM@DeDuplicationRule:
            header: INPUT_PARAM
            when: {RULE_CLASS: DeDuplicationRule}
            faq: dq_dedup_input_param
            question: "the DeDuplicationRule INPUT_PARAM shape (no home golden carries one; the D1 dump supplies it)"
      # 2026-10-14 (D1 post45 item 1): DATA_QUALITY_RULES from the STTM, the corpus's
      # classes (patterns_post45 rule_classes): the baseline per feed NullCheckRule
      # (Predefined, 186 rows / 114 workbooks), DeDuplicationRule (Predefined, 160 / 90
      # — the second Predefined class; post44 had AddCustomColumnsRule there, 38 / 4),
      # LRTrimRule (STDDelta, 180 / 104); DataTypeCastRule / DateConversionRule
      # (STDDelta) when the STTM types call for them; AddCustomColumnsRule and
      # LoadHeaderAndTrailerToSeparateTablesRule only for header / trailer feeds;
      # ReferentialCheckRule (Custom) only on a named lookup. Parameter formats: the
      # CAQH golden (split / AddCustomColumns / Referential) and the SFMC reference IIG.
      dq_rules: [header_trailer_split, add_custom_columns, null_check, dedup, referential_check, lr_trim, std_date_conversion, std_data_type_cast]
      dq_rule_classes: {header_trailer_split: LoadHeaderAndTrailerToSeparateTablesRule, add_custom_columns: AddCustomColumnsRule, null_check: NullCheckRule, dedup: DeDuplicationRule, referential_check: ReferentialCheckRule, lr_trim: LRTrimRule, std_date_conversion: DateConversionRule, std_data_type_cast: DataTypeCastRule}
      dq_rule_types: {header_trailer_split: Predefined, add_custom_columns: Predefined, null_check: Predefined, dedup: Predefined, referential_check: Custom, lr_trim: STDDelta, std_date_conversion: STDDelta, std_data_type_cast: STDDelta}
      dq_params:
        header_trailer_split: {INPUT_PARAM: SRC_FILE_NAME}
        add_custom_columns: {INPUT_PARAM: literal}
        referential_check: {INPUT_PARAM: stg_files.REF_RULE_VIEW, TARGET_COLUMN: REF_RULE_COL}
        lr_trim: {INPUT_PARAM: ""}
      dq_citations:
        header_trailer_split: &dqcaqh "the CAQH golden's DATA_QUALITY_RULES rows (Predefined; INPUT_PARAM SRC_FILE_NAME, SOURCE_COLUMN header|trailer columns, TARGET_COLUMN catalog,schema,table,location per table); the corpus 36 rows / 2 workbooks"
        add_custom_columns: "the CAQH golden's AddCustomColumnsRule rows (Predefined; a header / trailer feed's audit literal); the corpus 38 rows / 4 workbooks"
        null_check: "the corpus's top Predefined class (patterns_post45 rule_classes: NullCheckRule 186 rows / 114 workbooks); the pair_2 golden's NullCheckRule rows"
        dedup: "the corpus's second Predefined class (patterns_post45 rule_classes: DeDuplicationRule 160 rows / 90 workbooks); SOURCE_COLUMN = the detail table's key columns, INPUT_PARAM owed"
        referential_check: "the CAQH golden and fixtures/reference/SFMC_IIG.xlsx DATA_QUALITY_RULES (Custom; INPUT_PARAM stg_files.REF_RULE_VIEW, TARGET_COLUMN REF_RULE_COL); the corpus 52 rows / 16 workbooks"
        lr_trim: &dqsfmc "fixtures/reference/SFMC_IIG.xlsx DATA_QUALITY_RULES STDDelta rows (SOURCE_COLUMN = TARGET_COLUMN the standard columns); the corpus LRTrimRule 180 rows / 104 workbooks"
        std_date_conversion: *dqsfmc
        std_data_type_cast: *dqsfmc
      dq_split_style: header_and_trailer
      # {container} = the environment's stage container, {storage_account} its storage
      # account (environments: above; D1's is still a placeholder).
      dq_split_location: "abfss://{container}@{storage_account}.dfs.core.windows.net/{domain_path}Processed/{table}/"
      # 2026-10-14 (D1 post43 item 4): the prod ADLS_DELTA_INGESTION_DETAILS table
      # has a 55th column, FILE_METADATA - NULL on every SD prod row, blank in the
      # SFMC / CAQH IIGs; the iig_v2 template (from the pair-1 RFC package) lacks
      # it, so every row scored missing. The ACFC sheet carries it, decided blank
      # (metadata_inserts.sql writes NULL). A list replaces: the shipped headers +
      # FILE_METADATA.
      # 2026-10-14 (D1 post44 items 1 / 3): the corpus's DATA_FACTORY_PIPELINE_SCHEDULE
      # and EMAIL_TEMPLATE_CONFIG column sets (patterns.md): the schedule's PROCESS_NAME
      # ... IsFileCopyReqFlag and the email's EMAIL_NOTIFICATION_URL were not iig_v2
