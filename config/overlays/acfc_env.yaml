      deliberate_blanks:
        ADLS_DELTA_INGESTION_DETAILS:
          FILE_METADATA: "NULL on every prod row (SD pair_2 golden, acfc-results round7; docs/acfc/QUESTIONS_pair_2.md item 4), blank in the SFMC / CAQH IIGs"
        DATA_FACTORY_PIPELINE_SCHEDULE:
          PROCESS_NAME: "the corpus fills it in 60.9% of rows with one EDI process (59.0%) - not generalizable to a new feed (D1 post44 item 3)"
          SUBPROCESS_NAME: "the corpus fills it in 53.8% of rows, 51 patterns, the dominant 7.3% - not generalizable (D1 post44 item 3)"
          COMPLETION_SLA: &zero "the IIG corpus fills it in 0.0% of rows (patterns.json, D1 post44)"
          RUNTIME_SLA: *zero
          CRITICAL_PROCESSING_PERIOD: *zero
          UDF1: *zero
          UDF2: *zero
          UDF3: *zero
          UDF4: *zero
          UDF5: *zero
          IsFileCopyReqFlag: "the IIG corpus fills it in 4.4% of rows (patterns.json, D1 post44)"
      # FILE_HEADER_FLAG with no FAQ has_header answer: the file's format decides -
      # delimited 'Y' (SD prod, SFMC, CAQH), fixed-width 'N' (the pair-1 golden).
      file_header_flag_by_format: {delimited: "Y", fixed_width: "N"}
      file_header_flag_citation: "every golden at hand: delimited files Y (SD prod rows, acfc-results round7 pair_2; SFMC IIG ADLS_DELTA!AC2; CAQH golden), the fixed-width pair-1 golden N"
