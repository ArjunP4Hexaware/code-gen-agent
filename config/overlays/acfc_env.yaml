# ACFC environment overlay (IIG-first, 2026-10-07). Deep-merged onto
# config/config.yaml by codegen.config.load_config, ALWAYS and FIRST (every
# entry point); CODEGEN_CONFIG_OVERLAYS adds overlays on top; opt out only with
# CODEGEN_SKIP_ENV_OVERLAY=1 (docs/ACFC_DEPLOY.md "ACFC environment overlay").
# Values: the ACFC
# environment's catalogs and the framework's connection ids / containers as
# the real ADLS_DELTA_INGESTION_DETAILS rows carry them — environment
# constants, not per-feed values. always_blank REPLACES the template's list
# (lists are not merged): the six columns filled below leave it.
#
# DEFAULTS (Chunk D, 2026-10-09): acfc_prx (conventions.profile) and iig_v2
# (metadata.template) are the defaults of every run that loads this overlay —
# the App's selectors and every CLI run without --profile / --iig-template.
# The suite (CODEGEN_SKIP_ENV_OVERLAY=1) stays on the shipped edo_sfmc / iig_v1.
# Every CLI command's first line and `codegen doctor` name the active profile
# and template.
# 2026-10-14: the deployment ENVIRONMENTS a run chooses from — container names,
# the storage account and other workspace-scoped values are a run input, never
# silent constants (codegen.environments). CLI --environment <name> /
# --environment-file <yaml>; the App's run form (the default preselected, or
# "Other"). With neither, the default is used and INPUT_NEEDED run.environment
# records it. Every cell filled from here carries an iig_env NOTE naming the
# environment; the report header prints "environment: D1 (default)". Exactly one
# entry is marked default. D1 is the only populated one; QA / PROD are
# placeholders until their values are known.
# 2026-10-14 (post47): the catalogs (catalog_map: the STTM's logical catalog ->
# this environment's; default_catalog: the fallback per layer) and the
# framework's connection ids moved here too (were conventions.catalog_map, the
# acfc_prx profile's default_catalog and ADLS constants). A NAMED environment
# with a key unset (blank / a placeholder): under provider=live the run fails
# naming the unset keys, nothing written; under provider=mock each is an
# INPUT_NEEDED run.environment.<key> line and its cells stay empty
# (tests/test_d1_placeholders.py is the live-only check). A custom environment (--environment-file / the
# App's "Other") inherits nothing: each key it leaves out is an INPUT_NEEDED line
# and its cells stay empty.
environments:
  D1:
    default: true
    description: "ACFC D1 workspace (the SD prod rows' containers, round 6 / 7; the CAQH golden)"
    containers:
      # ADLS leg: files land in the landing container, the stage table is written
      # to the stage container (SD prod rows, the SFMC reference IIG, the pair-1
      # golden ADLS_DELTA!Z2 / AD2); the stage -> standard leg reads the stage
      # container and writes the standard one (acfc-results round7 pair_2)
      landing: mftlanding
      stage: z-use-d1-dlk-stage-01
      standard: z-use-d1-dlk-std-01
    # TODO D1: the stage storage account (the CAQH golden's abfss://<container>@<account>...)
    storage_account: "<<D1:STORAGE_ACCOUNT>>"
    # Multi-table rule 7 (docs/acfc/MULTI_TABLE_DESIGN.md): the STTM bands state
    # LOGICAL catalogs; D1's map, applied to every emitted catalog (cited in the
    # cell NOTE). default_catalog: the fallback for a band with Catalog blank.
    catalog_map: {PR_DLK: d1_dlk, PR_STD: d1_std}
    default_catalog: {stage: d1_dlk, standard: d1_std}
    # the framework's connection ids as the real ADLS_DELTA_INGESTION_DETAILS rows
    # carry them (SRC_ADLS / METADATA / TGT_CONNECTION_ID)
    connection_ids: {src_adls: "7", metadata: "4", target: "2"}
  QA:
    description: "QA — values not known yet"
    containers: {landing: "<<QA:CONTAINER.landing>>", stage: "<<QA:CONTAINER.stage>>", standard: "<<QA:CONTAINER.standard>>"}
    storage_account: "<<QA:STORAGE_ACCOUNT>>"
    catalog_map: {PR_DLK: "<<QA:CATALOG.PR_DLK>>", PR_STD: "<<QA:CATALOG.PR_STD>>"}
    default_catalog: {stage: "<<QA:CATALOG.stage>>", standard: "<<QA:CATALOG.standard>>"}
    connection_ids: {src_adls: "<<QA:CONNECTION_ID.src_adls>>", metadata: "<<QA:CONNECTION_ID.metadata>>", target: "<<QA:CONNECTION_ID.target>>"}
  PROD:
    description: "PROD — values not known yet"
    containers: {landing: "<<PROD:CONTAINER.landing>>", stage: "<<PROD:CONTAINER.stage>>", standard: "<<PROD:CONTAINER.standard>>"}
    storage_account: "<<PROD:STORAGE_ACCOUNT>>"
    catalog_map: {PR_DLK: "<<PROD:CATALOG.PR_DLK>>", PR_STD: "<<PROD:CATALOG.PR_STD>>"}
    default_catalog: {stage: "<<PROD:CATALOG.stage>>", standard: "<<PROD:CATALOG.standard>>"}
    connection_ids: {src_adls: "<<PROD:CONNECTION_ID.src_adls>>", metadata: "<<PROD:CONNECTION_ID.metadata>>", target: "<<PROD:CONNECTION_ID.target>>"}
conventions:
  profile: acfc_prx
  # catalog_map / the acfc_prx default_catalog: per environment (environments: above)
  # 2026-10-14 (D1 pair_12): the client-wide plan id -> LOB code table, the LOB
  # lookup's third source (after the FRD LOB table's plan-id and region
  # columns). TODO D1: no document at home carries it (the CAQH FRD's table is
  # region -> LOB, no plan ids) — the D1 overlay replaces this placeholder.
  lob_reference: {"<<D1:LOB_REFERENCE.plan_id>>": "<<D1:LOB_REFERENCE.lob>>"}
metadata:
  template: iig_v2
  templates:
    iig_v2:
      # Feed-family conventions (docs/acfc/MULTI_TABLE_DESIGN.md, 2026-10-08): the
      # CAQH-style family — LOB codes, an unknown STGDELTA primary key left blank
      # (open), STGDELTA OBJECT_NAME = the generalized file pattern. This is the
      # convention observed in the newest real sheet; whether it is current for new
      # feeds is on the Friday checklist (§7a). The pair-1 (PRX) family stays
      # selectable per feed: a feed overlay on top of this one sets
      # {lob: blank, stgdelta_unknown_primary_key: "NA", stgdelta_object_name: ...}.
      family_conventions:
        lob: codes
        stgdelta_unknown_primary_key: ""
        stgdelta_object_name: generalized_file_pattern
        # SCHEMA_DRIFT_FLAG N (round 6, 2026-10-13): the SD PROD rows say N on all
        # three files, as do both reference IIGs in the repo (SFMC_IIG.xlsx and
        # the pair-1 golden, ADLS_DELTA!AB2). Was Y from the older SD test-cells
        # sheet and the reported CAQH IIG — that conflict is a question
        # (docs/acfc/QUESTIONS_pair_2.md); pair 4's overlay keeps its own Y.
        schema_drift_flag: "N"
        # First real-row scorecard (2026-10-08, the three SD rows): SRC_FILE_NAME
        # is the name prefix + '*'; the audit columns are LOB, SRC_FILE_NAME,
        # REC_CREATION_TIME, REC_UPDATED_TIME, typed in the data columns'
        # casing. RECYCL_* with no recycle stated (round 6, 2026-10-13): N / NA / NA
        # — the SD prod rows of both recycle-less files, the pair-1 golden
        # (ADLS_DELTA!AT2:AV5) and the SD test-cells sheet agree (was: open).
        src_file_name: prefix_star
        audit_columns: [LOB, SRC_FILE_NAME, REC_CREATION_TIME, REC_UPDATED_TIME]
        audit_type_case: data
        recycle_unstated: "N"
        # STGDELTA OBJECT_ID (owner brief 2026-10-09): per (group, file) — the
        # row takes the ADLS row's OBJECT_ID of the one file that feeds its
        # table; several files feed it -> open, with a note.
        stgdelta_object_id: from_file
        citation: "ACFC environment overlay — the CAQH-style family, observed in the newest real sheet (Friday checklist); SD rows (first real-row scorecard, 2026-10-08)"
      constants:
        ADLS_DELTA_INGESTION_DETAILS:
          # the connection ids: per environment (environments:, environment_cells)
          # Round 6 (2026-10-13): the same in the SD prod rows, the SFMC reference
          # IIG and the pair-1 golden (ADLS_DELTA!Z2 / AD2); a FAQ has_header /
          # has_trailer answer still wins (derived cells are never overwritten).
          HEADER_FLAG: "Y"
          FILE_FOOTER_FLAG: "N"
        # 2026-10-14 (D1 post43 item 3b): the corpus is 100% one value and it is
        # a datetime - the D1 pair_2 golden rows read '9999-12-31 00:00:00'
        # (acfc-results round5 pair_2 mismatches.md); the shipped '9999-12-31'
        # (the IIG workbooks' spelling) was 6 mismatches.
        DATA_FACTORY_PIPELINE_SCHEDULE:
          ACTIVE_END_DATE: "9999-12-31 00:00:00"
        # 2026-10-14 (D1 post43 item 4): the stage -> standard leg reads the stage
        # container (the ADLS TGT_CONTAINER_NAME above) and writes the standard
        # one - the SD prod rows <prefix>-stage-01 / <prefix>-std-01 (acfc-results
        # round7 pair_2 mismatches.md), the CAQH golden the same pair in prod.
        # 2026-10-14: the containers moved to the run's environment (environments:
        # above, environment_cells below).
      environment_cells:
        ADLS_DELTA_INGESTION_DETAILS:
          SRC_CONTAINER_NAME: containers.landing
          TGT_CONTAINER_NAME: containers.stage
          SRC_ADLS_CONNECTION_ID: connection_ids.src_adls
          METADATA_CONNECTION_ID: connection_ids.metadata
          TGT_CONNECTION_ID: connection_ids.target
        STGDELTA_STDDELTA_INGESTION_DET:
          SRC_CONTAINER_NAME: containers.stage
          TGT_CONTAINER_NAME: containers.standard
      constant_citations:
        DATA_FACTORY_PIPELINE_SCHEDULE:
          ACTIVE_END_DATE: "the IIG corpus (D1, 2026-10-14): ACTIVE_END_DATE 100% one value; the pair_2 golden rows '9999-12-31 00:00:00' (acfc-results round5 pair_2)"
        ADLS_DELTA_INGESTION_DETAILS:
          HEADER_FLAG: &refs "both reference IIGs agree (fixtures/reference/SFMC_IIG.xlsx, fixtures/acfc_shapes/pair_1/golden/RFC_ACCUMULATORS_IIG.xlsx ADLS_DELTA_INGESTION_DETAILS) and so do the SD prod rows (round 6)"
          FILE_FOOTER_FLAG: *refs
      # Stage -> standard (2026-10-09): no document and no real row stated this
      # sheet's containers or connection ids, so they stayed OPEN (Friday
      # checklist 2 / 13) and the stage container rode only as an offer.
      # 2026-10-14 (D1 post43 item 4): the SD prod rows (acfc-results round7
      # pair_2) and the CAQH golden state both containers - the stage container
      # in, the standard container out: constants (above). Connection ids stay open.
      # SDOH-shaped (Socially Determined, 2026-10-07): applies to EVERY feed
      # until this overlay is split per source family — a PRX-shaped feed
      # (pair 1) gets these paths too.
      src_columns_style: named
      path_patterns:
        ADLS_DELTA_INGESTION_DETAILS:
          SRC_ADLS_PATH: "{landing_rel}"
          SRC_ADLS_ARCHVL_PATH: "{landing_rel}Archive/"
          TGT_ADLS_PATH: "/{domain_path}Processed/{stage_table}"
          TGT_RJT_ADLS_PATH: "/{domain_path}Reject/{reject_table}"
          # Written only when a document states the recycle (else open, the
          # shape offered in the tooltip).
          RECYCL_ADLS_PATH: "/{domain_path}Recycle/{stage_table}"
        # Stage -> standard (Chunk D, owner brief 2026-10-09; the first ACFC
        # run wrote these in the LANDING shape, /<landing container>/inbound/…).
        # Paths are container-relative — the container is its own column:
        # source = the stage side's Processed folder (the folder of the ADLS
        # row's TGT_ADLS_PATH above, no container segment); target / reject in
        # the standard container, the same shape as the stage container's
        # ({stage_table} here = this row's target table, {reject_table} = it +
        # _reject). SRC_ADLS_ARCHVL_PATH keeps the template's shape.
        # Round 6 (2026-10-13): the stage -> standard leg READS the stage table's
        # processed folder (= the ADLS row's TGT_ADLS_PATH) and WRITES the
        # processed directory; its archive sits beside Processed/ — the SD prod
        # rows and the SFMC reference IIG (STGDELTA!N2 / AA2 / U2) agree; the
        # pair-1 PRX golden has the opposite reading (its own family).
        STGDELTA_STDDELTA_INGESTION_DET:
          SRC_ADLS_PATH: "/{domain_path}Processed/{stage_table}"
          SRC_ADLS_ARCHVL_PATH: "/{domain_path}Archive/"
          TGT_ADLS_PATH: "/{domain_path}Processed/"
          TGT_RJT_ADLS_PATH: "/{domain_path}Reject/{reject_table}"
      path_citations:
        ADLS_DELTA_INGESTION_DETAILS:
          SRC_ADLS_PATH: &acfc "ACFC environment overlay (config/overlays/acfc_env.yaml)"
          SRC_ADLS_ARCHVL_PATH: *acfc
          TGT_ADLS_PATH: *acfc
          TGT_RJT_ADLS_PATH: *acfc
        STGDELTA_STDDELTA_INGESTION_DET:
          SRC_ADLS_PATH: &stgstd "ACFC environment overlay (config/overlays/acfc_env.yaml) — stage -> standard paths, container-relative (owner brief 2026-10-09); source = the stage table's processed folder, target = the processed directory, archive beside Processed/ (SD prod rows, round 6; SFMC reference IIG STGDELTA!N2 / AA2 / U2)"
          SRC_ADLS_ARCHVL_PATH: *stgstd
          TGT_ADLS_PATH: *stgstd
          TGT_RJT_ADLS_PATH: *stgstd
      # Round 4 (2026-10-12): one notebook row per leg, the framework's generic
      # notebooks, named as TWO independent references name them: the SFMC IIG
      # (fixtures/reference/SFMC_IIG.xlsx DATABRICKS_NOTEBOOK_DETAILS!L2 / L3) and the
      # SD prod rows (codegen-outputs/iig_validation/round3/pair_2/score.json, the
      # golden's notebook keys). The pair-1 family names its stage notebook _V1 (its
      # own overlay). 2026-10-13: PIPELINE_NAME = the schedule's name of the row's
      # leg (_pipeline_role; the same {feed} token the schedule rows use).
      # 2026-10-14 (D1 post44 item 2): the notebook NAME / PATH per flow come from
      # corpus_cells (below) - the SFMC / round-3 names (FileInvokeDQDeltaTable_V0.1,
      # DeltaInvokeDQStandardDeltaTable_V2) were the home references, not the corpus.
      # D1 post45 item 4: one EMAIL_TEMPLATE_CONFIG row per status the corpus uses on
      # file-ingestion pipelines - 4 per feed (patterns_post45 email: FilesNotReceived /
      # New Files to Process on 293, Success / Failed on 349 file-ingestion pipelines;
      # 293 pipelines carry all four), in the corpus's order.
      template_rows:
        DATABRICKS_NOTEBOOK_DETAILS:
          - {_layer: stage, _pipeline_role: file_to_stage, _citation: &nb "one framework notebook row per leg (SFMC IIG DATABRICKS_NOTEBOOK_DETAILS rows 2 / 3; 2 rows per workbook in the corpus: 378 rows / 189 workbooks)"}
          - {_layer: standard, _pipeline_role: stage_to_standard, _citation: *nb}
        EMAIL_TEMPLATE_CONFIG:
          - {STATUS: FilesNotReceived}
          - {STATUS: New Files to Process}
          - {STATUS: Success}
          - {STATUS: Failed}
      # 2026-10-13 — the IIG corpus's fill rate (tools/iig_fill_rate.py; at home:
      # the SFMC reference IIG, the pair-1 golden and the CAQH golden; on D1 the
      # 199-IIG corpus): columns filled in >90% of corpus rows that the agent left
      # blank, filled from the inputs (or the corpus's dominant constant), each
      # with a NOTE (iig_derived). IDs, the workspace URL / secret / cluster ids,
      # the audit stamps stay always_blank: assigned, never invented.
      # ACTIVE_START_DATE (a per-RFC go-live date: no document states it, no value
      # dominates) and BODY_QUERY (one golden, a feed-specific query) stay open.
      # 2026-10-14 (D1 post43 item 3b): schedule APPLICATION_NAME (corpus dominant
      # 38.8%) and notebook PROCESS_NAME (19.6%) are per-feed in prod, not the
      # home goldens' shapes - taken back to blank (pending_cells, below) until
      # the corpus patterns report says how prod builds them.
      # 2026-10-14 (framework owner's rule 1): PIPELINE_NAME is BSA-assigned - no
      # longer derived from the schedule's generated name (pipeline_roles below
      # carry no name; owed_cells ask for it per flow row).
      derived_cells:
        EMAIL_TEMPLATE_CONFIG:
          TEMPLATE_NAME: "{source}"
          PROCESS_NAME: "{source}"
      derived_citations:
        EMAIL_TEMPLATE_CONFIG:
          TEMPLATE_NAME: "corpus fill rate 2026-10-13: the process label (SFMC / CAQH goldens: the schedule's PROCESS_NAME, '<source> <subprocess>' - the documents state the source only); an FAQ process_name wins"
          PROCESS_NAME: "corpus fill rate 2026-10-13: the process label (as TEMPLATE_NAME); an FAQ process_name wins"
      # 2026-10-14 (D1 post45): cells from the FULL patterns report
      # (acfc-pairing-check codegen-outputs/pairing_check/patterns_post45/patterns.json,
      # 1 255 workbooks; per-flow tables, the file-ingestion STATUS x SUBJECT x BODY
      # table, the DQ rule classes). Every value carries its corpus share in the NOTE
      # (iig_corpus:<TAB>.<HEADER>). A value the corpus still scrubs as a G-token —
      # the handler-name prefix (G16_G17 fixed-width, G17 pipe), the workspace folder
      # G73, the email body word G564, the sender / recipient addresses, the webhook
      # URL — is a <<D1:...>> placeholder (here or in corpus_tokens): the cell stays
      # open with an iig_d1_placeholder NOTE and tests/test_d1_placeholders.py FAILS on
      # D1 while one survives (the D1 overlay on top sets them).
      # Tokens: {application} = the schedule's APPLICATION_NAME (the FAQ / answers
      # application_name, default the feed's SOURCE — INPUT_NEEDED with that default),
      # the corpus's G1; {template_name} = the email row's TEMPLATE_NAME; {freq} = the
      # feed's FREQUENCY (Daily / Weekly / Monthly); {domain}, {lob}.
      corpus_tokens:
        # patterns.json slots the fixed-width prefix as {domain} and the pipe one as
        # {source}; kept as placeholders until D1 confirms what the prefix is
        handler_prefix: "<<D1:NB.HANDLER_PREFIX>>"
        pipe_handler_prefix: "<<D1:NB.PIPE_HANDLER_PREFIX>>"
        workspace_folder: "<<D1:NB.WORKSPACE_FOLDER>>"
        email_files_word: "<<D1:EMAIL.G564>>"
      # A TPL subdomain selects the TPL_FileInvokeDQDeltaTable notebook (CAQH: "Third
      # Party Liability").
      tpl_subdomains: ["TPL", "Third Party Liability"]
      corpus_cells:
        EMAIL_TEMPLATE_CONFIG:
          SUBJECT:
            by: status
            values:
              FilesNotReceived: "{template_name} {freq} File Not Received -"
              New Files to Process: "{template_name} {freq} File Received -"
              Success: "{template_name} {freq} Load Completed -"
              Failed: "{template_name} {freq} Load  Failed -"
            share: "the file-ingestion STATUS x SUBJECT x BODY table (patterns_post45 email.combinations): '<TEMPLATE_NAME> <Freq> ...' per status — the top combination (G135 G499 G555 Daily) 2.3% of the 3 844 file-ingestion rows each, the same shape for History 2.0%; 'Load  Failed' has two spaces in the corpus"
          BODY:
            by: status
            values:
              FilesNotReceived: "{template_name} {freq} File Not Received"
              New Files to Process: "Received The {email_files_word} Files for {template_name} {freq}"
              Success: "{template_name} {freq} Data Load Successful"
              Failed: "{template_name} {freq} Data Load Failed"
            share: "the file-ingestion STATUS x SUBJECT x BODY table (patterns_post45): the BODY of the same combinations, 2.3% each; New Files to Process carries a scrubbed word (G564)"
            todo: "the word G564 of the 'Received The <G564> Files for ...' body (corpus_tokens.email_files_word)"
          ACTIVE_FLAG: {value: "Y", share: "Y in 100.0% of filled corpus rows (2 668)"}
          SENDER_NAME: {value: "dbo", share: "dbo in 97.8% of filled corpus rows (DBO 2.2%)"}
          SENDER_EMAIL:
            value: "<<D1:EMAIL.SENDER_EMAIL>>"
            share: "one address in 97.7% of filled corpus rows (scrubbed G571@<LOCAL_DENYLIST>.G572)"
            todo: "the dominant sender address"
          EMAIL_NOTIFICATION_URL:
            value: "<<D1:EMAIL.EMAIL_NOTIFICATION_URL>>"
            share: "one webhook in 95.4% of corpus rows (scrubbed host <REAL_WEBHOOK_HOST>)"
            todo: "the dominant webhook URL"
        DATABRICKS_NOTEBOOK_DETAILS:
          DATABRICKS_NOTEBOOK_NAME:
            by: notebook_kind
            values:
              stg_to_std: DeltaInvokeDQStandardDeltaTable_V4
              fixed_width: "{handler_prefix}_FixedWidthHandler,FileInvokeDQDeltaTable"
              fixed_width_tpl: "{handler_prefix}_FixedWidthHandler,TPL_FileInvokeDQDeltaTable"
              pipe_segmented: "{pipe_handler_prefix}_PIPE_DELIMITED_SEGMENT_HNDLR,FileInvokeDQDeltaTable"
              pipe_segmented_tpl: "{pipe_handler_prefix}_PIPE_DELIMITED_SEGMENT_HNDLR,TPL_FileInvokeDQDeltaTable"
              delimited: FileInvokeDQDeltaTable_V0.1
              delimited_tpl: TPL_FileInvokeDQDeltaTable
            share: "patterns_post45 per-flow DATABRICKS_NOTEBOOK_NAME"
            shares:
              stg_to_std: "stg_to_std: DeltaInvokeDQStandardDeltaTable_V4 86.2% of 130 rows (V2 10.8%)"
              fixed_width: "file_to_stg: G16_G17_FixedWidthHandler,FileInvokeDQDeltaTable 30.6% of 248 rows (the fixed-width two-notebook form)"
              fixed_width_tpl: "file_to_stg: G16_G17_FixedWidthHandler,TPL_FileInvokeDQDeltaTable 9.7% of 248 rows (the TPL variant)"
              pipe_segmented: "file_to_stg: G17_PIPE_DELIMITED_SEGMENT_HNDLR,FileInvokeDQDeltaTable 13.7% of 248 rows (the pipe-delimited segment form)"
              pipe_segmented_tpl: "file_to_stg: the pipe-delimited segment form (13.7%) with the TPL notebook of the TPL variant (9.7%) — the corpus has the TPL variant only with the fixed-width handler: confirm on D1"
              delimited: "file_to_stg: FileInvokeDQDeltaTable_V0.1 7.3% of 248 rows; FileInvokeDQDeltaTable_V0.2 4.0% — V0.1 picked, which version is current: flag for Nikshit"
              delimited_tpl: "file_to_stg: the TPL notebook of the TPL variant (9.7%, there with the fixed-width handler); no plain-delimited TPL row in the corpus: confirm on D1"
            todo: "the handler-name prefix (corpus_tokens.handler_prefix / pipe_handler_prefix; patterns.json slots it as {domain} / {source})"
          DATABRICKS_NOTEBOOK_PATH:
            by: notebook_kind
            values:
              stg_to_std: /iig/DeltaInvokeDQStandardDeltaTable_V4
              fixed_width: "/Workspace/{workspace_folder}/{handler_prefix}_FixedWidthHandler,/Workspace/{workspace_folder}/FileInvokeDQDeltaTable"
              fixed_width_tpl: "/Workspace/{workspace_folder}/{handler_prefix}_FixedWidthHandler,/Workspace/{workspace_folder}/TPL_FileInvokeDQDeltaTable"
              pipe_segmented: "/Workspace/{workspace_folder}/{pipe_handler_prefix}_PIPE_DELIMITED_SEGMENT_HNDLR,/Workspace/{workspace_folder}/FileInvokeDQDeltaTable"
              pipe_segmented_tpl: "/Workspace/{workspace_folder}/{pipe_handler_prefix}_PIPE_DELIMITED_SEGMENT_HNDLR,/Workspace/{workspace_folder}/TPL_FileInvokeDQDeltaTable"
              delimited: /Workspace/iig/FileInvokeDQDeltaTable_V0.1
              delimited_tpl: "/Workspace/{workspace_folder}/TPL_FileInvokeDQDeltaTable"
            share: "patterns_post45 per-flow DATABRICKS_NOTEBOOK_PATH"
            shares:
              stg_to_std: "stg_to_std: /iig/DeltaInvokeDQStandardDeltaTable_V4 76.9% of 130 rows"
              fixed_width: "file_to_stg: /Workspace/G73/G16_G17_FixedWidthHandler,/Workspace/G73/FileInvokeDQDeltaTable 27.4% of 248 rows"
              fixed_width_tpl: "file_to_stg: /Workspace/G73/G16_G17_FixedWidthHandler,/Workspace/G73/TPL_FileInvokeDQDeltaTable 12.9% of 248 rows"
              pipe_segmented: "file_to_stg: /Workspace/G73/G17_PIPE_DELIMITED_SEGMENT_HNDLR,/Workspace/G73/FileInvokeDQDeltaTable 13.7% of 248 rows"
              pipe_segmented_tpl: "the pipe-delimited segment path (13.7%) with the TPL notebook's (12.9%) — not a corpus row: confirm on D1"
              delimited: "file_to_stg: /Workspace/iig/FileInvokeDQDeltaTable_V0.1 4.8% of 248 rows (/iig/... 2.4%; V0.2 4.0%)"
              delimited_tpl: "the TPL notebook in the workspace folder (12.9%, there with the fixed-width handler) — not a corpus row: confirm on D1"
            todo: "the workspace folder G73 and the handler-name prefix (corpus_tokens)"
          PROCESS_NAME:
            by: flow
            values:
              file_to_stg: "{application}  Raw to stage load"
              stg_to_std: "{application}  stage to std load"
            share: "patterns_post45 per-flow PROCESS_NAME (the double space is the corpus's)"
            shares:
              file_to_stg: "file_to_stg: 'G1  Raw to stage load' 29.8% of 248 rows (G1 = the application)"
              stg_to_std: "stg_to_std: 'G1  stage to std load' 56.9% of 130 rows (G1 = the application)"
          SEQ_NM: {value: "1", share: "1 in 64.6% of corpus rows"}
          ACTIVE_FLAG: {value: "Y", share: "Y in 98.9% of corpus rows"}
        DATA_FACTORY_PIPELINE_SCHEDULE:
          PIPELINE_DESCRIPTION:
            by: flow
            values:
              file_to_stg: "{application} Stage Load"
              stg_to_std: "{application} Standard Load"
              grand_master: "{application} Grand Master Pipeline"
              master: "{application} Master Pipeline"
            share: "patterns_post45 per-flow PIPELINE_DESCRIPTION (G1 = the application)"
            shares:
              file_to_stg: "file_to_stg: 'G1 Stage Load' 33.3% of 20 212 rows"
              stg_to_std: "stg_to_std: 'G1 Standard Load' 64.0% of 10 514 rows"
              grand_master: "grand_master: 'G1 Grand Master Pipeline' 6.2% of 2 922 rows (the top slot pattern)"
              master: "master: 'G1 Master Pipeline' 9.8% of 1 850 rows (the top slot pattern)"
            offer: "{domain} {lob} LOB {freq} File Pipeline Incremental Load to STAGE"
            offer_when: lob_fanout
            offer_share: "the per-LOB file_to_stg form, e.g. '{domain} 0550 LOB Daily File Pipeline Incremental Load to STAGE' 2.1%, one per LOB"
