# ACFC environment overlay (IIG-first, 2026-10-07). Deep-merged onto
# config/config.yaml by codegen.config.load_config, ALWAYS and FIRST (every
# entry point); CODEGEN_CONFIG_OVERLAYS adds overlays on top; opt out only with
# CODEGEN_SKIP_ENV_OVERLAY=1 (docs/ACFC_DEPLOY.md "ACFC environment overlay").
# Values: the ACFC
# environment's catalogs and the framework's connection ids / containers as
# the real ADLS_DELTA_INGESTION_DETAILS rows carry them — environment
# constants, not per-feed values. always_blank REPLACES the template's list
# (lists are not merged): the six columns filled below leave it.
#
# DEFAULTS (Chunk D, 2026-10-09): acfc_prx (conventions.profile) and iig_v2
# (metadata.template) are the defaults of every run that loads this overlay —
# the App's selectors and every CLI run without --profile / --iig-template.
# The suite (CODEGEN_SKIP_ENV_OVERLAY=1) stays on the shipped edo_sfmc / iig_v1.
# Every CLI command's first line and `codegen doctor` name the active profile
# and template.
conventions:
  profile: acfc_prx
  # Multi-table rule 7 (docs/acfc/MULTI_TABLE_DESIGN.md): the STTM bands state
  # LOGICAL catalogs; this is the d1 environment's map, applied to every
  # emitted catalog (cited in the cell tooltip). Prod: identity (no map).
  # default_catalog below is the fallback only for a band with Catalog blank.
  catalog_map: {PR_DLK: d1_dlk, PR_STD: d1_std}
  # 2026-10-14 (D1 pair_12): the client-wide plan id -> LOB code table, the LOB
  # lookup's third source (after the FRD LOB table's plan-id and region
  # columns). TODO D1: no document at home carries it (the CAQH FRD's table is
  # region -> LOB, no plan ids) — the D1 overlay replaces this placeholder.
  lob_reference: {"<<D1:LOB_REFERENCE.plan_id>>": "<<D1:LOB_REFERENCE.lob>>"}
  profiles:
    acfc_prx:
      default_catalog: {stage: d1_dlk, standard: d1_std}
metadata:
  template: iig_v2
  templates:
    iig_v2:
      # Feed-family conventions (docs/acfc/MULTI_TABLE_DESIGN.md, 2026-10-08): the
      # CAQH-style family — LOB codes, an unknown STGDELTA primary key left blank
      # (open), STGDELTA OBJECT_NAME = the generalized file pattern. This is the
      # convention observed in the newest real sheet; whether it is current for new
      # feeds is on the Friday checklist (§7a). The pair-1 (PRX) family stays
      # selectable per feed: a feed overlay on top of this one sets
      # {lob: blank, stgdelta_unknown_primary_key: "NA", stgdelta_object_name: ...}.
      family_conventions:
        lob: codes
        stgdelta_unknown_primary_key: ""
        stgdelta_object_name: generalized_file_pattern
        # SCHEMA_DRIFT_FLAG N (round 6, 2026-10-13): the SD PROD rows say N on all
        # three files, as do both reference IIGs in the repo (SFMC_IIG.xlsx and
        # the pair-1 golden, ADLS_DELTA!AB2). Was Y from the older SD test-cells
        # sheet and the reported CAQH IIG — that conflict is a question
        # (docs/acfc/QUESTIONS_pair_2.md); pair 4's overlay keeps its own Y.
        schema_drift_flag: "N"
        # First real-row scorecard (2026-10-08, the three SD rows): SRC_FILE_NAME
        # is the name prefix + '*'; the audit columns are LOB, SRC_FILE_NAME,
        # REC_CREATION_TIME, REC_UPDATED_TIME, typed in the data columns'
        # casing. RECYCL_* with no recycle stated (round 6, 2026-10-13): N / NA / NA
        # — the SD prod rows of both recycle-less files, the pair-1 golden
        # (ADLS_DELTA!AT2:AV5) and the SD test-cells sheet agree (was: open).
        src_file_name: prefix_star
        audit_columns: [LOB, SRC_FILE_NAME, REC_CREATION_TIME, REC_UPDATED_TIME]
        audit_type_case: data
        recycle_unstated: "N"
        # STGDELTA OBJECT_ID (owner brief 2026-10-09): per (group, file) — the
        # row takes the ADLS row's OBJECT_ID of the one file that feeds its
        # table; several files feed it -> open, with a note.
        stgdelta_object_id: from_file
        citation: "ACFC environment overlay — the CAQH-style family, observed in the newest real sheet (Friday checklist); SD rows (first real-row scorecard, 2026-10-08)"
      constants:
        ADLS_DELTA_INGESTION_DETAILS:
          SRC_ADLS_CONNECTION_ID: "7"
          METADATA_CONNECTION_ID: "4"
          TGT_CONNECTION_ID: "2"
          SRC_CONTAINER_NAME: mftlanding
          TGT_CONTAINER_NAME: z-use-d1-dlk-stage-01
          # Round 6 (2026-10-13): the same in the SD prod rows, the SFMC reference
          # IIG and the pair-1 golden (ADLS_DELTA!Z2 / AD2); a FAQ has_header /
          # has_trailer answer still wins (derived cells are never overwritten).
          HEADER_FLAG: "Y"
          FILE_FOOTER_FLAG: "N"
        # 2026-10-14 (D1 post43 item 3b): the corpus is 100% one value and it is
        # a datetime - the D1 pair_2 golden rows read '9999-12-31 00:00:00'
        # (acfc-results round5 pair_2 mismatches.md); the shipped '9999-12-31'
        # (the IIG workbooks' spelling) was 6 mismatches.
        DATA_FACTORY_PIPELINE_SCHEDULE:
          ACTIVE_END_DATE: "9999-12-31 00:00:00"
        # 2026-10-14 (D1 post43 item 4): the stage -> standard leg reads the stage
        # container (the ADLS TGT_CONTAINER_NAME above) and writes the standard
        # one - the SD prod rows <prefix>-stage-01 / <prefix>-std-01 (acfc-results
        # round7 pair_2 mismatches.md), the CAQH golden the same pair in prod.
        STGDELTA_STDDELTA_INGESTION_DET:
          SRC_CONTAINER_NAME: z-use-d1-dlk-stage-01
          TGT_CONTAINER_NAME: z-use-d1-dlk-std-01
      constant_citations:
        STGDELTA_STDDELTA_INGESTION_DET:
          SRC_CONTAINER_NAME: &stgcont "ACFC environment overlay: the stage container the ADLS leg writes (ADLS TGT_CONTAINER_NAME) and the standard container - SD prod rows <prefix>-stage-01 / <prefix>-std-01 (acfc-results round7 pair_2), the CAQH golden's STGDELTA rows"
          TGT_CONTAINER_NAME: *stgcont
        DATA_FACTORY_PIPELINE_SCHEDULE:
          ACTIVE_END_DATE: "the IIG corpus (D1, 2026-10-14): ACTIVE_END_DATE 100% one value; the pair_2 golden rows '9999-12-31 00:00:00' (acfc-results round5 pair_2)"
        ADLS_DELTA_INGESTION_DETAILS:
          HEADER_FLAG: &refs "both reference IIGs agree (fixtures/reference/SFMC_IIG.xlsx, fixtures/acfc_shapes/pair_1/golden/RFC_ACCUMULATORS_IIG.xlsx ADLS_DELTA_INGESTION_DETAILS) and so do the SD prod rows (round 6)"
          FILE_FOOTER_FLAG: *refs
          SRC_ADLS_CONNECTION_ID: &acfc "ACFC environment overlay (config/overlays/acfc_env.yaml)"
          METADATA_CONNECTION_ID: *acfc
          TGT_CONNECTION_ID: *acfc
          SRC_CONTAINER_NAME: *acfc
          TGT_CONTAINER_NAME: *acfc
      # Stage -> standard (2026-10-09): no document and no real row stated this
      # sheet's containers or connection ids, so they stayed OPEN (Friday
      # checklist 2 / 13) and the stage container rode only as an offer.
      # 2026-10-14 (D1 post43 item 4): the SD prod rows (acfc-results round7
      # pair_2) and the CAQH golden state both containers - the stage container
      # in, the standard container out: constants (above). Connection ids stay open.
      # SDOH-shaped (Socially Determined, 2026-10-07): applies to EVERY feed
      # until this overlay is split per source family — a PRX-shaped feed
      # (pair 1) gets these paths too.
      src_columns_style: named
      path_patterns:
        ADLS_DELTA_INGESTION_DETAILS:
          SRC_ADLS_PATH: "{landing_rel}"
          SRC_ADLS_ARCHVL_PATH: "{landing_rel}Archive/"
          TGT_ADLS_PATH: "/{domain_path}Processed/{stage_table}"
          TGT_RJT_ADLS_PATH: "/{domain_path}Reject/{reject_table}"
          # Written only when a document states the recycle (else open, the
          # shape offered in the tooltip).
          RECYCL_ADLS_PATH: "/{domain_path}Recycle/{stage_table}"
        # Stage -> standard (Chunk D, owner brief 2026-10-09; the first ACFC
        # run wrote these in the LANDING shape, /<landing container>/inbound/…).
        # Paths are container-relative — the container is its own column:
        # source = the stage side's Processed folder (the folder of the ADLS
        # row's TGT_ADLS_PATH above, no container segment); target / reject in
        # the standard container, the same shape as the stage container's
        # ({stage_table} here = this row's target table, {reject_table} = it +
        # _reject). SRC_ADLS_ARCHVL_PATH keeps the template's shape.
        # Round 6 (2026-10-13): the stage -> standard leg READS the stage table's
        # processed folder (= the ADLS row's TGT_ADLS_PATH) and WRITES the
        # processed directory; its archive sits beside Processed/ — the SD prod
        # rows and the SFMC reference IIG (STGDELTA!N2 / AA2 / U2) agree; the
        # pair-1 PRX golden has the opposite reading (its own family).
        STGDELTA_STDDELTA_INGESTION_DET:
          SRC_ADLS_PATH: "/{domain_path}Processed/{stage_table}"
          SRC_ADLS_ARCHVL_PATH: "/{domain_path}Archive/"
          TGT_ADLS_PATH: "/{domain_path}Processed/"
          TGT_RJT_ADLS_PATH: "/{domain_path}Reject/{reject_table}"
      path_citations:
        ADLS_DELTA_INGESTION_DETAILS:
          SRC_ADLS_PATH: *acfc
          SRC_ADLS_ARCHVL_PATH: *acfc
          TGT_ADLS_PATH: *acfc
          TGT_RJT_ADLS_PATH: *acfc
        STGDELTA_STDDELTA_INGESTION_DET:
          SRC_ADLS_PATH: &stgstd "ACFC environment overlay (config/overlays/acfc_env.yaml) — stage -> standard paths, container-relative (owner brief 2026-10-09); source = the stage table's processed folder, target = the processed directory, archive beside Processed/ (SD prod rows, round 6; SFMC reference IIG STGDELTA!N2 / AA2 / U2)"
          SRC_ADLS_ARCHVL_PATH: *stgstd
          TGT_ADLS_PATH: *stgstd
          TGT_RJT_ADLS_PATH: *stgstd
      # Round 4 (2026-10-12): one notebook row per leg, the framework's generic
      # notebooks, named as TWO independent references name them: the SFMC IIG
      # (fixtures/reference/SFMC_IIG.xlsx DATABRICKS_NOTEBOOK_DETAILS!L2 / L3) and the
      # SD prod rows (codegen-outputs/iig_validation/round3/pair_2/score.json, the
      # golden's notebook keys). The pair-1 family names its stage notebook _V1 (its
      # own overlay). 2026-10-13: PIPELINE_NAME = the schedule's name of the row's
      # leg (_pipeline_role; the same {feed} token the schedule rows use).
      # 2026-10-14 (D1 post44 item 2): the notebook NAME / PATH per flow come from
      # corpus_cells (below) - the SFMC / round-3 names (FileInvokeDQDeltaTable_V0.1,
      # DeltaInvokeDQStandardDeltaTable_V2) were the home references, not the corpus.
      # Item 1: one EMAIL_TEMPLATE_CONFIG row per status the corpus uses on
      # file-ingestion pipelines - 4 per feed, as the pair_2 golden (acfc-pairing-check
      # 2026-10-14_post44.md). patterns.json names two (Success 23.1%, Failed 23.1%);
      # TODO D1: the other two from the --patterns email table (e3689b0), in this list.
      template_rows:
        DATABRICKS_NOTEBOOK_DETAILS:
          - {_layer: stage, _pipeline_role: file_to_stage, _citation: &nb "one framework notebook row per leg (SFMC IIG DATABRICKS_NOTEBOOK_DETAILS rows 2 / 3; 2 rows per workbook in the corpus: 378 rows / 189 workbooks)"}
          - {_layer: standard, _pipeline_role: stage_to_standard, _citation: *nb}
        EMAIL_TEMPLATE_CONFIG:
          - {STATUS: Success}
          - {STATUS: Failed}
          - {STATUS: "<<D1:EMAIL.STATUS_3>>"}
          - {STATUS: "<<D1:EMAIL.STATUS_4>>"}
      # 2026-10-13 — the IIG corpus's fill rate (tools/iig_fill_rate.py; at home:
      # the SFMC reference IIG, the pair-1 golden and the CAQH golden; on D1 the
      # 199-IIG corpus): columns filled in >90% of corpus rows that the agent left
      # blank, filled from the inputs (or the corpus's dominant constant), each
      # with a NOTE (iig_derived). IDs, the workspace URL / secret / cluster ids,
      # the audit stamps stay always_blank: assigned, never invented.
      # ACTIVE_START_DATE (a per-RFC go-live date: no document states it, no value
      # dominates) and BODY_QUERY (one golden, a feed-specific query) stay open.
      # 2026-10-14 (D1 post43 item 3b): schedule APPLICATION_NAME (corpus dominant
      # 38.8%) and notebook PROCESS_NAME (19.6%) are per-feed in prod, not the
      # home goldens' shapes - taken back to blank (pending_cells, below) until
      # the corpus patterns report says how prod builds them.
      derived_cells:
        DATABRICKS_NOTEBOOK_DETAILS:
          PIPELINE_NAME: "{pipeline}"
        EMAIL_TEMPLATE_CONFIG:
          TEMPLATE_NAME: "{source}"
          PROCESS_NAME: "{source}"
      derived_citations:
        DATABRICKS_NOTEBOOK_DETAILS:
          PIPELINE_NAME: "the notebook runs in its leg's pipeline: the DATA_FACTORY_PIPELINE_SCHEDULE name of the file_to_stage / stage_to_standard row (SFMC IIG DATABRICKS_NOTEBOOK_DETAILS!B2 / B3 = DATA_FACTORY_PIPELINE_SCHEDULE!B2 / B3)"
        EMAIL_TEMPLATE_CONFIG:
          TEMPLATE_NAME: "corpus fill rate 2026-10-13: the process label (SFMC / CAQH goldens: the schedule's PROCESS_NAME, '<source> <subprocess>' - the documents state the source only); an FAQ process_name wins"
          PROCESS_NAME: "corpus fill rate 2026-10-13: the process label (as TEMPLATE_NAME); an FAQ process_name wins"
      # 2026-10-14 (D1 post44 items 1-3): cells from the 199-IIG corpus's patterns
      # report (acfc-pairing-check codegen-outputs/pairing_check/patterns_post44/
      # patterns.json). ONLY values that file states are written; a value it does not
      # carry (scrubbed G<n> / <LOCAL_DENYLIST>, or a per-flow / per-status list it
      # has no breakdown for) is a <<D1:...>> placeholder: the cell stays open with
      # an iig_d1_placeholder NOTE, and tests/test_d1_placeholders.py FAILS on D1
      # while one survives. TODO D1: an overlay on top of this one (CODEGEN_CONFIG_
      # OVERLAYS) replaces every placeholder, from the post-e3689b0 --patterns run
      # (per-flow breakdown, email STATUS table, framework vocabulary unscrubbed).
      # Every value carries its corpus share in the NOTE (iig_corpus:<TAB>.<HEADER>).
      corpus_cells:
        EMAIL_TEMPLATE_CONFIG:
          SUBJECT:
            by: status
            values: {Success: "<<D1:EMAIL.SUBJECT.Success>>", Failed: "<<D1:EMAIL.SUBJECT.Failed>>", "*": "<<D1:EMAIL.SUBJECT.other_status>>"}
            share: "SUBJECT filled in 19.8% of corpus rows, 162 patterns, the dominant 3.4% (scrubbed G-tokens); no per-STATUS breakdown in patterns.json"
            todo: "the dominant SUBJECT slot pattern per STATUS from the --patterns email table (file-ingestion pipelines)"
          BODY:
            by: status
            values: {Success: "<<D1:EMAIL.BODY.Success>>", Failed: "<<D1:EMAIL.BODY.Failed>>", "*": "<<D1:EMAIL.BODY.other_status>>"}
            share: "BODY filled in 19.8% of corpus rows, 156 patterns, the dominant 21.7% (scrubbed G-tokens); no per-STATUS breakdown in patterns.json"
            todo: "the dominant BODY slot pattern per STATUS from the --patterns email table"
          ACTIVE_FLAG: {value: "Y", share: "Y in 100.0% of filled corpus rows"}
          SENDER_NAME: {value: "dbo", share: "dbo in 97.8% of filled corpus rows (DBO 2.2%)"}
          SENDER_EMAIL:
            value: "<<D1:EMAIL.SENDER_EMAIL>>"
            share: "one address in 97.7% of filled corpus rows (scrubbed G30@<LOCAL_DENYLIST>.G31)"
            todo: "the dominant sender address"
          EMAIL_TO:
            value: "<<D1:EMAIL.EMAIL_TO>>"
            share: "one address in 47.6% of filled corpus rows (the dominant; 24 values), scrubbed G33@<LOCAL_DENYLIST>.G31"
            todo: "the dominant recipient (47.6% - not a majority: confirm per feed)"
          EMAIL_NOTIFICATION_URL:
            value: "<<D1:EMAIL.EMAIL_NOTIFICATION_URL>>"
            share: "one webhook in 95.4% of corpus rows (scrubbed host <REAL_WEBHOOK_HOST>)"
            todo: "the dominant webhook URL"
        DATABRICKS_NOTEBOOK_DETAILS:
          DATABRICKS_NOTEBOOK_NAME:
            by: flow
            values: {file_to_stg: "<<D1:NB.NAME.file_to_stg>>", stg_to_std: "<<D1:NB.NAME.stg_to_std>>", dq: "<<D1:NB.NAME.dq>>"}
            share: "15 name patterns in the corpus; dominant DeltaInvokeDQStandardDeltaTable_V4 29.6%, G4_V0.1 19.6%, {domain}_G6,FileInvokeDQDeltaTable 10.1% - no flow breakdown in patterns.json"
            todo: "the flow -> notebook table from the --patterns per-flow breakdown"
          DATABRICKS_NOTEBOOK_PATH:
            by: flow
            values: {file_to_stg: "<<D1:NB.PATH.file_to_stg>>", stg_to_std: "<<D1:NB.PATH.stg_to_std>>", dq: "<<D1:NB.PATH.dq>>"}
            share: "19 path patterns in the corpus; dominant /iig/DeltaInvokeDQStandardDeltaTable_V4 26.5%, /iig/G4_V0.1 19.6% - no flow breakdown in patterns.json"
            todo: "the flow -> notebook path table from the --patterns per-flow breakdown"
          PROCESS_NAME:
            by: flow
            values: {file_to_stg: "<<D1:NB.PROCESS_NAME.file_to_stg>>", stg_to_std: "<<D1:NB.PROCESS_NAME.stg_to_std>>"}
            share: "107 patterns; dominant 'G1  Raw to stage load' 19.6% and 'G1  stage to std load' 19.6% (G1 a scrubbed constant, not a slot) - no flow breakdown in patterns.json"
            todo: "the dominant slot pattern per flow (e.g. '{source} Raw to stage load') from the --patterns per-flow breakdown"
          SEQ_NM: {value: "1", share: "1 in 64.6% of corpus rows"}
          ACTIVE_FLAG: {value: "Y", share: "Y in 98.9% of corpus rows"}
        DATA_FACTORY_PIPELINE_SCHEDULE:
          PIPELINE_DESCRIPTION:
            by: flow
            values: {grand_master: "<<D1:SCHED.DESC.grand_master>>", master: "<<D1:SCHED.DESC.master>>", file_to_stg: "<<D1:SCHED.DESC.file_to_stg>>", stg_to_std: "<<D1:SCHED.DESC.stg_to_std>>"}
            share: "395 patterns; dominant 'G1 Stage Load' 18.9% / 'G1 Standard Load' 18.9% (G1 a scrubbed constant) - no flow breakdown in patterns.json"
            todo: "the dominant slot pattern per flow from the --patterns per-flow breakdown"
          APPLICATION_NAME:
            value: "<<D1:SCHED.APPLICATION_NAME>>"
            share: "the dominant value G1 in 38.8% of corpus rows (27 values; scrubbed)"
            todo: "one overlay value (Soham sets it on D1)"
          DAY_OF_SCHEDULE:
            by: frequency
            values: {Weekly: "0"}
            share: "filled in 3.5% of corpus rows; Daily 0.0% filled, Weekly 29.8% filled with '0' the dominant (14.9% of Weekly rows; WEEKLY: 26.8%)"
          LAYER_NAME:
            by: flow
            values: {file_to_stg: STAGE, stg_to_std: STANDARD}
            share: "filled in 38.4% of corpus rows: STAGE 88.7%, STANDARD 7.3%"
          ACTIVE_FLAG: {value: "Y", share: "Y in 97.5% of corpus rows"}
          NO_OF_CYCLE_PER_DAY: {value: "1", share: "1 in 98.2% of corpus rows"}
      # ACTIVE_START_DATE: the per-RFC go-live date - no document states it, no value
      # dominates (19.4%): owed. `generate` prints QUESTION feeds[<i>].active_start_date
      # and writes it to answers_template.yaml; `generate --answers` (or the FAQ
      # companion active_start_date) fills it.
      owed_cells:
        DATA_FACTORY_PIPELINE_SCHEDULE:
          ACTIVE_START_DATE: {faq: active_start_date, question: "the go-live date of this RFC's pipelines (ACTIVE_START_DATE, 'YYYY-MM-DD 00:00:00' as the corpus writes it): no document states it and no corpus value dominates (19.4%)"}
      # 2026-10-14 (D1 post44 item 5): DATA_QUALITY_RULES from the STTM, the corpus's
      # classes in frequency order (patterns.json rule_classes: Predefined G72 186 /
      # G73 160 rows = NullCheckRule (the pair_2 golden's Predefined class) and
      # AddCustomColumnsRule (the CAQH golden's); STDDelta LRTrimRule 180; Custom
      # ReferentialCheckRule 52; STDDelta DateConversionRule 34, DataTypeCastRule 32).
      # Parameter formats: the CAQH golden (split / AddCustomColumns / Referential)
      # and the SFMC reference IIG (fixtures/reference/SFMC_IIG.xlsx
      # DATA_QUALITY_RULES: Referential, LRTrim, DateConversion, DataTypeCast).
      dq_rules: [header_trailer_split, add_custom_columns, null_check, referential_check, lr_trim, std_date_conversion, std_data_type_cast]
      dq_rule_classes: {header_trailer_split: LoadHeaderAndTrailerToSeparateTablesRule, add_custom_columns: AddCustomColumnsRule, null_check: NullCheckRule, referential_check: ReferentialCheckRule, lr_trim: LRTrimRule, std_date_conversion: DateConversionRule, std_data_type_cast: DataTypeCastRule}
      dq_rule_types: {header_trailer_split: Predefined, add_custom_columns: Predefined, null_check: Predefined, referential_check: Custom, lr_trim: STDDelta, std_date_conversion: STDDelta, std_data_type_cast: STDDelta}
      dq_params:
        header_trailer_split: {INPUT_PARAM: SRC_FILE_NAME}
        add_custom_columns: {INPUT_PARAM: literal}
        referential_check: {INPUT_PARAM: stg_files.REF_RULE_VIEW, TARGET_COLUMN: REF_RULE_COL}
        lr_trim: {INPUT_PARAM: ""}
      dq_citations:
        header_trailer_split: &dqcaqh "the CAQH golden's DATA_QUALITY_RULES rows (Predefined; INPUT_PARAM SRC_FILE_NAME, SOURCE_COLUMN header|trailer columns, TARGET_COLUMN catalog,schema,table,location per table)"
        add_custom_columns: *dqcaqh
        null_check: "the pair_2 golden's Predefined NullCheckRule rows (acfc-pairing-check 2026-10-14_post44.md); the corpus's top Predefined class"
        referential_check: "the CAQH golden and fixtures/reference/SFMC_IIG.xlsx DATA_QUALITY_RULES (Custom; INPUT_PARAM stg_files.REF_RULE_VIEW, TARGET_COLUMN REF_RULE_COL)"
        lr_trim: &dqsfmc "fixtures/reference/SFMC_IIG.xlsx DATA_QUALITY_RULES STDDelta rows (SOURCE_COLUMN = TARGET_COLUMN the standard columns)"
        std_date_conversion: *dqsfmc
        std_data_type_cast: *dqsfmc
      dq_split_style: header_and_trailer
      # TODO D1: the stage storage account (the CAQH golden's abfss://<container>@<account>...).
      dq_split_location: "abfss://{container}@<<D1:STORAGE_ACCOUNT>>.dfs.core.windows.net/{domain_path}Processed/{table}/"
      # 2026-10-14 (D1 post43 item 4): the prod ADLS_DELTA_INGESTION_DETAILS table
      # has a 55th column, FILE_METADATA - NULL on every SD prod row, blank in the
      # SFMC / CAQH IIGs; the iig_v2 template (from the pair-1 RFC package) lacks
      # it, so every row scored missing. The ACFC sheet carries it, decided blank
      # (metadata_inserts.sql writes NULL). A list replaces: the shipped headers +
      # FILE_METADATA.
      # 2026-10-14 (D1 post44 items 1 / 3): the corpus's DATA_FACTORY_PIPELINE_SCHEDULE
      # and EMAIL_TEMPLATE_CONFIG column sets (patterns.md): the schedule's PROCESS_NAME
      # ... IsFileCopyReqFlag and the email's EMAIL_NOTIFICATION_URL were not iig_v2
      # columns.
      tabs:
        DATA_FACTORY_PIPELINE_SCHEDULE:
          headers: [PIPELINE_ID, PIPELINE_NAME, PARENT_PIPELINE_ID, PIPELINE_DESCRIPTION, PIPELINE_FREQUENCY, NO_OF_CYCLE_PER_DAY, DAY_OF_SCHEDULE, ACTIVE_FLAG, ACTIVE_START_DATE, ACTIVE_END_DATE, ESTIMATED_START_TIME, APPLICATION_NAME, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE, PROCESS_NAME, SUBPROCESS_NAME, LAYER_NAME, COMPLETION_SLA, RUNTIME_SLA, CRITICAL_PROCESSING_PERIOD, UDF1, UDF2, UDF3, UDF4, UDF5, IsFileCopyReqFlag]
        EMAIL_TEMPLATE_CONFIG:
          headers: [TEMPLATE_ID, TEMPLATE_NAME, PROCESS_NAME, STATUS, ACTIVE_FLAG, SUBJECT, BODY, BODY_QUERY, SENDER_NAME, SENDER_EMAIL, EMAIL_TO, EMAIL_CC, CREATED_BY, CREATED_DATE, UPDATED_BY, UPDATED_DATE, EMAIL_NOTIFICATION_URL]
