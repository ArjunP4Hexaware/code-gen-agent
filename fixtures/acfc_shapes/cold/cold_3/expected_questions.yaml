# cold_3 (nb_provider_roster) - the CLI chain BEFORE answers, the way the ACFC harness
# runs it (overlay on, mock layout + provider): per stage the exit code and,
# in printed order, the label and answers.yaml key of every QUESTION /
# UNRESOLVED line (reason text is not pinned). generate does not run: every
# sheet is held back, extract-sttm writes no contract. Pinned by
# tests/test_cold_pairs.py; answers.yaml beside this file settles every key
# (and the questions those answers open) - the chain then exits 0.
layout:
  exit: 3
  lines:
    - [UNRESOLVED, "sheets[2]/band[2]/layer"]
    - [UNRESOLVED, "sheets[2]/source/field_name"]
    - [UNRESOLVED, "sheets[2]/stage/table"]
    - [UNRESOLVED, "sheets[2]/stage/column"]
    - [UNRESOLVED, "sheets[2]/stage/target_type"]
    - [UNRESOLVED, "sheets[3]/band[2]/layer"]
    - [UNRESOLVED, "sheets[3]/source/field_name"]
    - [UNRESOLVED, "sheets[3]/stage/table"]
    - [UNRESOLVED, "sheets[3]/stage/column"]
    - [UNRESOLVED, "sheets[3]/stage/target_type"]
    - [UNRESOLVED, "sheets[4]/band[2]/layer"]
    - [UNRESOLVED, "sheets[4]/source/field_name"]
    - [UNRESOLVED, "sheets[4]/stage/table"]
    - [UNRESOLVED, "sheets[4]/stage/column"]
    - [UNRESOLVED, "sheets[4]/stage/target_type"]
extract_frd:
  exit: 0
  lines: []
extract_sttm:
  exit: 3
  lines:
    - [UNRESOLVED, "sheets[2]/band[2]/layer"]
    - [UNRESOLVED, "sheets[3]/band[2]/layer"]
    - [UNRESOLVED, "sheets[4]/band[2]/layer"]
generate: null
