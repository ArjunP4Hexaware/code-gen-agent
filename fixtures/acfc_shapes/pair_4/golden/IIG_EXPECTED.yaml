# Pair 4 (nb_cob_report, synthetic vendor "Northwind Benefits") — the IIG rows
# the multi-table model expects, WRITTEN BY HAND from the owners' model
# (docs/acfc/MULTI_TABLE_DESIGN.md §1) and the fixture's inputs:
#   fixtures/acfc_shapes/pair_4/sttm_nb_cob_report.xlsx   (built)
#   fixtures/acfc_shapes/pair_4/frd_nb_cob_report.contract.json (built)
#   fixtures/acfc_shapes/pair_4/config_overlay.yaml        (environment values,
#                                                           catalog_map PR_DLK -> d1_dlk,
#                                                           PR_STD -> d1_std)
# Template: iig_v2, conventions profile acfc_prx.
#
# Cell semantics:
#   "text"  the expected cell value (OBJECT_ID: the object's position in its group,
#           the framework convention — ADLS / DQ per file)
#   ""      deliberately blank (NULL in the metadata DB) by convention
#   null    OPEN — the column's owner fills it (engineer-assigned ids / names,
#           the RFC number, or an open question of §7); the generator must
#           leave it blank and flag it, never invent it
# Keys starting with "_" are annotations, not IIG columns.
# `columns` = the owner map (class per column, template header order):
#   per_file | per_table | per_feed | environment | convention | engineer
#
# Catalog cells carry the MAPPED catalog: each table's own band states the
# logical one (Stage band PR_DLK, Standard band PR_STD) and the overlay's
# catalog_map maps it; the overlay's default_catalog is never used.
#
# All eight IIG sheets are goldened (Chunk A, 2026-10-08 — every cell pinned).
# FILE_ADLS_INGESTION_DETAILS stays one row per feed (open Q5);
# DATABRICKS_NOTEBOOK_DETAILS is the one uninventoried row (no notebook
# inventory overlay); ADLS_FIXED_WIDTH_HANDLER has no row (a delimited file).
# Pair 4 is the CAQH-style feed FAMILY (family_conventions in its overlay):
# LOB codes, STGDELTA OBJECT_NAME = the generalized file pattern (wildcards and
# extension removed), an unknown STGDELTA TGT_PRIMARY_KEY blank (open). The
# pair-1 family's golden fills those three cells its own way (blank / its own
# form / 'NA') — both are conventions, neither an error (2026-10-08).

