[project]
name = "codegen-data-engineer-agent"
# Bump on every Apps redeploy that changes src/ — the Apps pip install
# reuses its cached wheel for an unchanged version, silently deploying
# stale code against fresh config (bitten 2026-08-28).
version = "0.5.7"
description = "Generates Databricks ingestion pipelines (PySpark + Delta) from approved machine-readable contracts"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # STTM workbook extractor (codegen.extract) input format.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # M7: validates the emitted T-SQL DML (tsql dialect); the emitter degrades
    # to a structural check when it is absent.
    "sqlglot>=25",
    # Needed only to run the tests generated for the emitted pipelines.
    "pyspark>=3.5,<4.0",
    "delta-spark>=3.2,<4.0",
    # fastapi.testclient is httpx-backed. Test-only: the served app never
    # makes outbound HTTP calls, so this stays out of the [ui] runtime extra.
    "httpx>=0.27",
]
# Live Layer-2 provider only; the default install stays offline/mock.
# Pin tracks frd-to-sttm's proven major version.
live = [
    "anthropic>=0.60,<1",
]
# Demo UI backend only (ui/backend); the generator itself never needs these.
ui = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # The gate's ruff check runs `python -m ruff` at generation time (also
    # from the UI's live runs), so a plain .[ui] install must carry it —
    # without it every feed verdicts FAIL (STANDUP_NOTES 2026-09-16).
    "ruff>=0.5",
    # FastAPI's multipart form handling — the from-device upload route
    # (POST /api/demo/upload) refuses to register without it.
    "python-multipart",
]
# Databricks volumes transport only (codegen.databricks) — the edge seam
# that fetches FRD/STTM documents from Unity Catalog volumes. Optional by
# the same doctrine as SharePoint: the generator itself never opens a
# Databricks connection, and every other command runs without this extra.
databricks = [
    "databricks-sdk>=0.30",
]

[project.scripts]
codegen = "codegen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Without this a non-editable wheel ships no templates and PackageLoader
# fails at runtime (editable installs mask the problem).
[tool.setuptools.package-data]
codegen = ["templates/**/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
