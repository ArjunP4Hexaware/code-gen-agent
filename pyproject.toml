[project]
name = "codegen-data-engineer-agent"
version = "0.1.0"
description = "Generates Databricks ingestion pipelines (PySpark + Delta) from approved machine-readable contracts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # Needed only to run the tests generated for the emitted pipelines.
    "pyspark>=3.5,<4.0",
    "delta-spark>=3.2,<4.0",
]
# Demo UI backend only (ui/backend); the generator itself never needs these.
ui = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
codegen = "codegen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Without this a non-editable wheel ships no templates and PackageLoader
# fails at runtime (editable installs mask the problem).
[tool.setuptools.package-data]
codegen = ["templates/**/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
